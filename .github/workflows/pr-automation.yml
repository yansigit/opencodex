                core.warning(`PR #${candidate.number} reconciliation failed: ${error.message}`);
              }
            }
            const summary = [
              "## PR automation",
              `- Mode: \`${mode}\``,
              `- Scanned: ${counts.scanned}`,
              `- Updated: ${counts.updated}`,
              `- Merged: ${counts.merged}`,
              `- Held: ${counts.held}`,
              `- Failed (isolated): ${counts.failed}`,
            ].join("\n");
            const agedHolds = summarizeAgedHolds(holdRecords);
            const holdSummary = agedHolds.length === 0
              ? "- Holds older than 24h: none"
              : ["- Holds older than 24h (labels retained):", ...agedHolds.map(item =>
                `  - #${item.number} (${item.ageHours}h): ${item.title}`)].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n${holdSummary}\n`);
