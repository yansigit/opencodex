name: PR automation

on:
  push:
    branches: [dev]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
    branches: [dev]
  check_run:
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-automation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'yansigit/opencodex' && (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: read
      issues: write
      pull-requests: write
    env:
      PR_AUTOMATION_MODE: ${{ vars.PR_AUTOMATION_MODE || 'shadow' }}
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            MAINTAINERS.md

      - name: Create PR automation App token
        id: app-token
        if: env.PR_AUTOMATION_MODE == 'update' || env.PR_AUTOMATION_MODE == 'merge'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.PR_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Reconcile pull requests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_AUTOMATION_TOKEN: ${{ steps.app-token.outputs.token }}
          CURSOR_BUGBOT_APP_ID: ${{ vars.CURSOR_BUGBOT_APP_ID }}
          CURSOR_BUGBOT_USER_ID: ${{ vars.CURSOR_BUGBOT_USER_ID }}
          JULES_BOT_USER_ID: ${{ vars.JULES_BOT_USER_ID }}
          PR_AUTOMATION_APP_USER_ID: ${{ vars.PR_AUTOMATION_APP_USER_ID }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const {
              approvalEvidence,
              botMergeEvidence,
              buildAutomationComment,
              classifyPullRequest,
              exactHeadGate,
              summarizeAgedHolds,
            } = require(path.join(process.cwd(), ".github", "scripts", "pr-automation.cjs"));
            const { parseAgentMaintenanceState } = require(path.join(
              process.cwd(), ".github", "scripts", "agent-maintenance.cjs"
            ));
            const { parseMaintainerLogins } = require(path.join(
              process.cwd(), ".github", "scripts", "pr-maintainers.cjs"
            ));

            const { owner, repo } = context.repo;
            const mode = process.env.PR_AUTOMATION_MODE || "shadow";
            if (!["off", "shadow", "update", "merge"].includes(mode)) {
              throw new Error(`Invalid PR_AUTOMATION_MODE: ${mode}`);
            }
            if (mode === "off") {
              core.info("PR automation is disabled.");
              return;
            }
            const appToken = process.env.PR_AUTOMATION_TOKEN || "";
            if ((mode === "update" || mode === "merge") && !appToken) {
              throw new Error("PR_AUTOMATION_TOKEN is required in update or merge mode");
            }
            const apiHeaders = {
              accept: "application/vnd.github+json",
              "content-type": "application/json",
              "x-github-api-version": "2022-11-28",
            };
            async function appRequest(method, apiPath, body) {
              const response = await fetch(`https://api.github.com${apiPath}`, {
                method,
                headers: { ...apiHeaders, authorization: `Bearer ${appToken}` },
                ...(body ? { body: JSON.stringify(body) } : {}),
              });
              const text = await response.text();
              let data = null;
              try { data = text ? JSON.parse(text) : null; } catch {}
              return { status: response.status, ok: response.ok, data };
            }
            async function getPr(number) {
              return (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
            }
            async function currentDevSha() {
              return (await github.rest.repos.getBranch({ owner, repo, branch: "dev" })).data.commit.sha;
            }
            async function listFiles(pr) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100
              });
              return {
                files,
                complete: Number.isInteger(pr.changed_files) && pr.changed_files >= 0 &&
                  files.length === pr.changed_files && files.every(file => typeof file.filename === "string" && file.filename),
              };
            }
            async function reviewThreads(number) {
              const result = [];
              let cursor = null;
              for (;;) {
                const page = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $cursor) {
                          pageInfo { hasNextPage endCursor }
                          nodes { isResolved comments(first: 100) { nodes { author { login } } } }
                        }
                      }
                    }
                  }
                `, { owner, repo, number, cursor });
                const threads = page?.repository?.pullRequest?.reviewThreads;
                if (!threads || !threads.pageInfo || typeof threads.pageInfo.hasNextPage !== "boolean" ||
                    !Array.isArray(threads.nodes)) {
                  throw new Error("malformed reviewThreads page");
                }
                result.push(...threads.nodes);
                if (!threads.pageInfo.hasNextPage) return result;
                if (!threads.pageInfo.endCursor) throw new Error("reviewThreads pagination cursor missing");
                cursor = threads.pageInfo.endCursor;
              }
            }
            async function rawEvidence(pr) {
              const [baseSha, fileResult, checks, comments, reviews, events, threads, headCommit] = await Promise.all([
                currentDevSha(),
                listFiles(pr),
                github.paginate(github.rest.checks.listForRef, { owner, repo, ref: pr.head.sha, per_page: 100 }),
                github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 }),
                github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number, per_page: 100 }),
                github.paginate(github.rest.issues.listEvents, { owner, repo, issue_number: pr.number, per_page: 100 }),
                reviewThreads(pr.number),
                github.rest.repos.getCommit({ owner, repo, ref: pr.head.sha }).then(response => response.data),
              ]);
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `dev...${pr.head.sha}`
              });
              return { baseSha, fileResult, checks, comments, reviews, events, threads, headCommit, comparison: comparison.data };
            }
            function reviewEvidence(evidence) {
              if (!Array.isArray(evidence.threads) || !evidence.threads.every(thread =>
                thread && typeof thread.isResolved === "boolean")) {
                return { ok: false, reason: "malformed-review-threads" };
              }
              if (!Array.isArray(evidence.reviews)) return { ok: false, reason: "malformed-reviews" };
              const latestByReviewer = new Map();
              for (const review of evidence.reviews) {
                const login = review?.user?.login;
                if (!login || typeof review.state !== "string" || !Number.isFinite(Number(review.id))) {
                  return { ok: false, reason: "malformed-review" };
                }
                const prior = latestByReviewer.get(login.toLowerCase());
                if (!prior || Number(review.id) > Number(prior.id)) latestByReviewer.set(login.toLowerCase(), review);
              }
              const unresolved = evidence.threads.filter(thread => thread.isResolved !== true);
              const changesRequested = [...latestByReviewer.values()].filter(review =>
                String(review.state).toUpperCase() === "CHANGES_REQUESTED");
              return {
                ok: unresolved.length === 0 && changesRequested.length === 0,
                unresolvedThreads: unresolved.length,
                changesRequested: changesRequested.length,
                reason: unresolved.length ? "unresolved-review-thread" :
                  changesRequested.length ? "changes-requested" : "reviews-clear",
              };
            }
            function labelsOf(pr) {
              return (pr.labels || []).map(label => typeof label === "string" ? label : label.name).filter(Boolean);
            }
            function approvalRecord(comments) {
              const marker = "<!-- opencodex-pr-automation-approval:";
              const comment = comments.filter(item => item.user?.login === "github-actions[bot]" &&
                Number(item.user?.id) === 41898282 && item.body?.includes(marker))
                .sort((a, b) => Number(b.id) - Number(a.id))[0];
              if (!comment) return null;
              const match = comment.body.match(/<!-- opencodex-pr-automation-approval:([\s\S]*?) -->/);
              if (!match) return null;
              try { return JSON.parse(match[1]); } catch { return null; }
            }
            function syncRecord(comments) {
              const marker = "<!-- opencodex-pr-automation-sync:";
              const comment = comments.filter(item => item.user?.login === "github-actions[bot]" &&
                Number(item.user?.id) === 41898282 && item.body?.includes(marker))
                .sort((a, b) => Number(b.id) - Number(a.id))[0];
              if (!comment) return null;
              const match = comment.body.match(/<!-- opencodex-pr-automation-sync:([\s\S]*?) -->/);
              if (!match) return null;
              try { return JSON.parse(match[1]); } catch { return null; }
            }
            function approvalRecordFor(pr, evidence) {
              const approvalEvent = context.eventName === "pull_request_target" && context.payload.action === "labeled" &&
                context.payload.label?.name === "automerge-approved" &&
                context.payload.pull_request?.number === pr.number &&
                context.payload.pull_request?.head?.sha === pr.head.sha;
              if (!approvalEvent || !labelsOf(pr).includes("automerge-approved")) return null;
              const maintainers = parseMaintainerLogins(fs.readFileSync(path.join(process.cwd(), "MAINTAINERS.md"), "utf8"));
              const latest = evidence.events.filter(event => event.label?.name === "automerge-approved" &&
                ["labeled", "unlabeled"].includes(String(event.event || event.action).toLowerCase()))
                .sort((a, b) => Number(b.id) - Number(a.id))[0];
              const actor = latest?.actor?.login || latest?.user?.login;
              const payloadActor = context.payload.sender?.login;
              if (!latest || !actor || !payloadActor || actor.toLowerCase() !== payloadActor.toLowerCase() ||
                  !maintainers.some(login => login.toLowerCase() === actor.toLowerCase()) ||
                  latest.event !== "labeled") return null;
              return { headSha: pr.head.sha, actor, labeledEventId: Number(latest.id) };
            }
            function syncRecordFor(pr, evidence) {
              const syncProducerUserId = Number(process.env.PR_AUTOMATION_APP_USER_ID);
              const exactEvent = context.eventName === "pull_request_target" && context.payload.action === "labeled" &&
                context.payload.label?.name === "autonomous-sync" &&
                context.payload.pull_request?.number === pr.number &&
                context.payload.pull_request?.head?.sha === pr.head.sha;
              if (!exactEvent || !labelsOf(pr).includes("autonomous-sync")) return null;
              const latest = evidence.events.filter(event => event.label?.name === "autonomous-sync" &&
                ["labeled", "unlabeled"].includes(String(event.event || event.action).toLowerCase()))
                .sort((a, b) => Number(b.id) - Number(a.id))[0];
              const actor = latest?.actor || latest?.user;
              if (!latest || latest.event !== "labeled" || Number(actor?.id) !== syncProducerUserId || actor?.type !== "Bot" ||
                  context.payload.sender?.type !== "Bot" || Number(context.payload.sender?.id) !== syncProducerUserId) return null;
              return { headSha: pr.head.sha, actorId: syncProducerUserId, labeledEventId: Number(latest.id) };
            }
            function controllerEvidence(pr, evidence, maintenanceMap) {
              const syncProducerUserId = Number(process.env.PR_AUTOMATION_APP_USER_ID);
              const labels = labelsOf(pr);
              const maintenance = maintenanceMap.records.get(pr.number);
              const maintenanceError = maintenanceMap.errors.get(pr.number) ||
                (maintenanceMap.orphanErrors.length > 0 &&
                  (Number(pr.user?.id) === Number(process.env.JULES_BOT_USER_ID) ||
                    labels.some(label => /^(?:agent:|autonomous-fix|jules)/i.test(label))) ?
                  maintenanceMap.orphanErrors[0] : null);
              const maintenanceStatus = maintenance?.state?.status;
              const julesState = maintenanceStatus === "queued" ? "QUEUED" :
                maintenanceStatus === "planning" ? "PLANNING" :
                  maintenanceStatus === "running" ? "IN_PROGRESS" :
                    maintenanceStatus === "reviewing" ? "COMPLETED" :
                      maintenanceStatus === "failed" ? "FAILED" :
                        maintenanceStatus === "completed" ? "COMPLETED" : null;
              const classification = classifyPullRequest({
                pr,
                repository: `${owner}/${repo}`,
                agentResolved: labels.includes("agent-resolved-sync") || labels.includes("jules-resolved"),
                julesState,
              });
              const baseAncestry = evidence.comparison.behind_by === 0 &&
                ["ahead", "identical"].includes(evidence.comparison.status);
              const gateInput = {
                pr,
                liveHeadSha: pr.head.sha,
                expectedHeadSha: pr.head.sha,
                baseRef: pr.base.ref,
                currentBaseSha: pr.base.sha,
                expectedBaseSha: evidence.baseSha,
                mergeable: pr.mergeable,
                mergeableState: pr.mergeable_state,
                baseAncestry,
                changedFiles: evidence.fileResult.files,
                changedFilesCount: pr.changed_files,
                changedFilesComplete: evidence.fileResult.complete,
                checkRuns: evidence.checks,
                requiredChecks: ["ci", "hygiene", "enforce-target", "mergeable"],
                expectedAppIds: { ci: 15368, hygiene: 15368, "enforce-target": 15368, mergeable: 15368 },
              };
              const gate = exactHeadGate(gateInput);
              const latestSyncLabel = evidence.events.filter(event => event.label?.name === "autonomous-sync" &&
                ["labeled", "unlabeled"].includes(event.event)).sort((a, b) => Number(b.id) - Number(a.id))[0];
              const syncActor = latestSyncLabel?.actor || latestSyncLabel?.user;
              const trustedSyncLabel = labels.includes("autonomous-sync") && latestSyncLabel?.event === "labeled" &&
                syncActor?.type === "Bot" && Number(syncActor?.id) === syncProducerUserId;
              const syncState = syncRecord(evidence.comments) || syncRecordFor(pr, evidence);
              const syncRecordMatches = syncState && syncState.headSha === pr.head.sha &&
                Number(syncState.actorId) === syncProducerUserId &&
                Number(syncState.labeledEventId) === Number(latestSyncLabel?.id);
              const forbiddenSyncLabel = labels.some(label => /^(?:agent:|.*(?:handoff|escalat))/i.test(label));
              const sync = classification.deterministicSync && trustedSyncLabel && syncRecordMatches && !forbiddenSyncLabel &&
                Number(pr.user?.id) === syncProducerUserId &&
                String(pr.body || "").includes("<!-- opencodex-fork-sync -->") &&
                String(pr.head?.ref || "").startsWith("sync/upstream-") &&
                gate.ok && gate.safeForAutomation && evidence.fileResult.complete;
              const merge = botMergeEvidence({
                ...gateInput,
                liveHeadSha: pr.head.sha,
                headCommit: evidence.headCommit,
                checkRuns: evidence.checks,
                changedFiles: evidence.fileResult.files,
                expectedBugbotAppId: Number(process.env.CURSOR_BUGBOT_APP_ID),
                expectedJulesUserId: Number(process.env.JULES_BOT_USER_ID),
                authorizedSessionId: maintenanceStatus === "reviewing" ? maintenance?.state?.sessionId : null,
                sessionId: maintenanceStatus === "reviewing" ? maintenance?.state?.sessionId : null,
                provenance: sync ? {
                  trusted: true,
                  authenticated: true,
                  kind: "fork-upstream-sync",
                  producerIdentity: "fork-upstream-sync",
                } : null,
                expectedTrustedProducerIdentity: "fork-upstream-sync",
              });
              const blockedByMaintenance = Boolean(maintenanceError);
              if (blockedByMaintenance) {
                classification.eligibleForUpdate = false;
                classification.eligibleForMerge = false;
                classification.class = "hold";
                classification.reason = "malformed-maintenance-state";
                merge.ready = false;
                merge.reason = "malformed-maintenance-state";
              }
              const approval = approvalEvidence({
                liveHeadSha: pr.head.sha,
                labels,
                labelEvents: evidence.events,
                maintainers: parseMaintainerLogins(fs.readFileSync(path.join(process.cwd(), "MAINTAINERS.md"), "utf8")),
                approvalRecord: approvalRecord(evidence.comments),
              });
              return { classification, gate, merge, approval, sync, reviews: reviewEvidence(evidence), maintenance, maintenanceError };
            }
            async function loadMaintenanceMap() {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: "all", per_page: 100
              });
              const records = new Map();
              const maintenanceStateErrors = new Map();
              const orphanErrors = [];
              for (const issue of issues.filter(item => !item.pull_request)) {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: issue.number, per_page: 100
                });
                const stateComments = comments.filter(comment =>
                  comment.user?.login === "github-actions[bot]" && Number(comment.user?.id) === 41898282 &&
                  comment.body?.includes("<!-- opencodex-agent-maintenance-state:")
                ).sort((a, b) => Number(a.id) - Number(b.id));
                for (const comment of stateComments) {
                  let state;
                  try {
                    state = parseAgentMaintenanceState(comment.body);
                  } catch (error) {
                    const match = String(comment.body || "").match(/"pullRequestNumber"\s*:\s*(\d+)/);
                    const pullRequestNumber = match ? Number(match[1]) : null;
                    const message = `malformed maintenance state on issue #${issue.number}: ${error.message}`;
                    if (pullRequestNumber) maintenanceStateErrors.set(pullRequestNumber, message);
                    else orphanErrors.push(message);
                    continue;
                  }
                  if (state.pullRequestNumber === null) continue;
                  const existing = records.get(state.pullRequestNumber);
                  if (existing) {
                    const message = `duplicate or conflicting maintenance state for PR #${state.pullRequestNumber}`;
                    maintenanceStateErrors.set(state.pullRequestNumber, message);
                    records.delete(state.pullRequestNumber);
                    continue;
                  }
                  records.set(state.pullRequestNumber, { issueNumber: issue.number, state, commentId: comment.id });
                }
              }
              return { records, errors: maintenanceStateErrors, orphanErrors };
            }
            async function updateBranch(pr, maintenanceMap) {
              let expected = pr.head.sha;
              for (let attempt = 0; attempt < 2; attempt += 1) {
                const fresh = await getPr(pr.number);
                if (fresh.state !== "open" || fresh.base.ref !== "dev" || fresh.head.sha !== expected) {
                  return { action: "head-changed", pr: fresh };
                }
                const freshEvidence = await rawEvidence(fresh);
                const freshMaintenanceMap = await loadMaintenanceMap();
                const freshResult = controllerEvidence(fresh, freshEvidence, freshMaintenanceMap);
                if (!freshResult.classification.eligibleForUpdate) return { action: "ineligible", pr: fresh };
                const intendedBaseSha = freshEvidence.baseSha;
                const result = await appRequest("PUT", `/repos/${owner}/${repo}/pulls/${pr.number}/update-branch`, {
                  expected_head_sha: expected,
                  update_method: "merge",
                });
                if (result.status === 422) {
                  const raced = await getPr(pr.number);
                  const message = String(result.data?.message || "").toLowerCase();
                  const expectedHeadMismatch = /expected[_\s-]+head[_\s-]+sha/.test(message) || /head\s*(?:sha\s*)?mismatch/.test(message);
                  const conflictOrValidation = /conflict|validation/.test(message);
                  const racedEvidence = await rawEvidence(raced);
                  const racedMaintenanceMap = await loadMaintenanceMap();
                  const racedResult = controllerEvidence(raced, racedEvidence, racedMaintenanceMap);
                if (result.status === 422 && expectedHeadMismatch && !conflictOrValidation && attempt === 0 &&
                      raced.head.sha !== expected && racedResult.classification.eligibleForUpdate) {
                    // Retry exactly once after a proven stale-head race; conflict 422s never retry.
                    expected = raced.head.sha;
                    continue;
                  }
                  return { action: "update-conflict", pr: raced };
                }
                if (!result.ok) throw new Error(`update-branch returned HTTP ${result.status}`);
                let updated = await getPr(pr.number);
                for (let poll = 0; poll < 6; poll += 1) {
                  const verify = await github.rest.repos.compareCommitsWithBasehead({
                    owner, repo, basehead: `${intendedBaseSha}...${updated.head.sha}`
                  });
                  if (verify.data.behind_by === 0) {
                    const updatedEvidence = await rawEvidence(updated);
                    const updatedResult = controllerEvidence(updated, updatedEvidence, await loadMaintenanceMap());
                    if (updated.state !== "open" || updated.draft || updated.base.ref !== "dev" ||
                        updated.base.sha !== intendedBaseSha) {
                      throw new Error("updated PR failed live post-update validation");
                    }
                    const sameRepository = updated.head?.repo?.full_name === `${owner}/${repo}`;
                    const valid = sameRepository &&
                      updatedEvidence.baseSha === intendedBaseSha &&
                      updatedResult.classification.eligibleForUpdate && verify.data.behind_by === 0;
                    if (valid) return { action: "updated", pr: updated };
                    throw new Error("updated PR failed live post-update validation");
                  }
                  await new Promise(resolve => setTimeout(resolve, 1000));
                  updated = await getPr(pr.number);
                }
                throw new Error("updated head does not contain current dev");
              }
              return { action: "update-race-exhausted", pr: await getPr(pr.number) };
            }
            async function clearApprovalState(pr, removeApprovalLabel, removeSyncLabel = false) {
              const fresh = await getPr(pr.number);
              if (removeApprovalLabel && labelsOf(fresh).includes("automerge-approved")) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: "automerge-approved" });
              }
              if (removeSyncLabel && labelsOf(fresh).includes("autonomous-sync")) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: "autonomous-sync" });
              }
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100
              });
              const status = comments.filter(comment => comment.user?.login === "github-actions[bot]" &&
                Number(comment.user?.id) === 41898282 && comment.body?.includes("<!-- opencodex-pr-automation:v1 -->"))
                .sort((a, b) => Number(b.id) - Number(a.id))[0];
              if (!status || !status.body.includes("<!-- opencodex-pr-automation-approval:")) return;
              const latest = await getPr(pr.number);
              if (latest.state !== "open") return;
              try {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: status.id,
                  body: status.body.replace(/\n*<!-- opencodex-pr-automation-(?:approval|sync):[\s\S]*? -->\s*/g, "").trimEnd(),
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                core.warning(`Approval state comment disappeared for #${pr.number}; continuing.`);
              }
            }
            async function invalidateApprovalIfStale(pr, evidence) {
              const record = approvalRecord(evidence.comments);
              const eventRecord = approvalRecordFor(pr, evidence);
              const labelUnbound = labelsOf(pr).includes("automerge-approved") && !eventRecord &&
                (!record || record.headSha !== pr.head.sha);
              const staleRecord = record && record.headSha !== pr.head.sha;
              if ((labelUnbound || staleRecord) && mode !== "off") {
                await clearApprovalState(pr, Boolean(labelUnbound));
                return true;
              }
              return false;
            }
            async function invalidateSyncIfStale(pr, evidence) {
              const record = syncRecord(evidence.comments);
              const eventRecord = syncRecordFor(pr, evidence);
              const labelUnbound = labelsOf(pr).includes("autonomous-sync") && !eventRecord &&
                (!record || record.headSha !== pr.head.sha);
              const staleRecord = record && record.headSha !== pr.head.sha;
              if ((labelUnbound || staleRecord) && mode !== "off") {
                await clearApprovalState(pr, false, true);
                return true;
              }
              return false;
            }
            async function upsertComment(pr, body, newApprovalRecord, newSyncRecord) {
              const fresh = await getPr(pr.number);
              if (fresh.state !== "open") return;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100
              });
              const latest = await getPr(pr.number);
              // If the head moved during the read, skip comment rendering rather than publish stale evidence.
              if (latest.state !== "open" || latest.head.sha !== fresh.head.sha) return;
              const existing = comments.filter(comment =>
                comment.user?.login === "github-actions[bot]" &&
                Number(comment.user?.id) === 41898282 &&
                comment.body?.includes("<!-- opencodex-pr-automation:v1 -->")
              ).sort((a, b) => Number(b.id) - Number(a.id))[0];
              const priorApproval = existing && approvalRecord([existing]);
              const priorSync = existing && syncRecord([existing]);
              const retainedApproval = newApprovalRecord || (priorApproval && priorApproval.headSha === latest.head.sha ? priorApproval : null);
              const retainedSync = newSyncRecord || (priorSync && priorSync.headSha === latest.head.sha ? priorSync : null);
              const fullBody = `${body}${retainedApproval ? `\n\n<!-- opencodex-pr-automation-approval:${JSON.stringify(retainedApproval)} -->` : ""}${retainedSync ? `\n\n<!-- opencodex-pr-automation-sync:${JSON.stringify(retainedSync)} -->` : ""}`;
              try {
                if (existing) {
