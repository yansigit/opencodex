                  classification: result.classification,
                  exactHeadGate: result.gate,
                  approvalEvidence: result.approval,
                  botMergeEvidence: result.merge,
                  baseSha: evidence.baseSha,
                  headSha: pr.head.sha,
                  action: needsUpdate ? "behind" : "observed",
                  nextAction: result.merge.ready ? "merge authorized by bot evidence" : undefined,
                }), approvalRecordFor(pr, evidence), syncRecordFor(pr, evidence));
                counts.held += 1;
