            // Promotion PRs targeting main are status-only and are never mutated here.
            const maintenanceMap = await loadMaintenanceMap();
            const counts = { scanned: 0, updated: 0, merged: 0, held: 0, failed: 0 };
            const holdRecords = [];
            for (const candidate of all) {
              counts.scanned += 1;
              try {
                let pr = await getPr(candidate.number);
                let evidence = await rawEvidence(pr);
                let result = controllerEvidence(pr, evidence, maintenanceMap);
                const needsUpdate = pr.base.sha !== evidence.baseSha || pr.mergeable_state === "behind" ||
                  Number(evidence.comparison.behind_by) > 0;
                const approvalInvalidated = await invalidateApprovalIfStale(pr, evidence);
                const syncInvalidated = await invalidateSyncIfStale(pr, evidence);
                if (approvalInvalidated || syncInvalidated) {
                  pr = await getPr(pr.number);
                  evidence = await rawEvidence(pr);
                  result = controllerEvidence(pr, evidence, await loadMaintenanceMap());
                }
                if ((mode === "update" || mode === "merge") && result.classification.eligibleForUpdate && needsUpdate) {
                  const updated = await updateBranch(pr, maintenanceMap);
                  pr = updated.pr;
                  if (updated.action === "updated") {
                    counts.updated += 1;
                    await clearApprovalState(pr, true, true);
                  }
                  // Re-read every race/conflict outcome before rendering status; never report stale evidence.
                  evidence = await rawEvidence(pr);
                  result = controllerEvidence(pr, evidence, await loadMaintenanceMap());
                  const postUpdateApprovalInvalidated = await invalidateApprovalIfStale(pr, evidence);
                  const postUpdateSyncInvalidated = await invalidateSyncIfStale(pr, evidence);
                  if (postUpdateApprovalInvalidated || postUpdateSyncInvalidated) {
                    pr = await getPr(pr.number);
                    evidence = await rawEvidence(pr);
                    result = controllerEvidence(pr, evidence, await loadMaintenanceMap());
                  }
                }
                await dispatchEnforcerIfNeeded(pr, evidence);
                if (mode === "merge") {
                  pr = await getPr(pr.number);
                  evidence = await rawEvidence(pr);
                  result = controllerEvidence(pr, evidence, maintenanceMap);
                  if ((result.merge.ready || (result.approval.approved && result.gate.ok &&
                      result.gate.safeForAutomation && result.classification.class === "same-repo-human")) && result.reviews.ok) {
                    const live = await getPr(pr.number);
                    const finalEvidence = await rawEvidence(live);
                    const finalMaintenanceMap = await loadMaintenanceMap();
                    const finalResult = controllerEvidence(live, finalEvidence, finalMaintenanceMap);
                    const finalBaseSha = finalEvidence.baseSha;
                    if (live.state !== "open" || live.draft || live.base.ref !== "dev" ||
                        live.head.sha !== pr.head.sha || live.base.sha !== evidence.baseSha ||
                        live.base.sha !== finalBaseSha || !finalResult.reviews.ok ||
                        !(finalResult.merge.ready || (finalResult.approval.approved && finalResult.gate.ok &&
                          finalResult.gate.safeForAutomation && finalResult.classification.class === "same-repo-human"))) {
