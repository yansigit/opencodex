                  check?.conclusion !== "success" || check?.head_sha !== pr.head.sha || Number(check?.app?.id) !== 15368) return;
              const target = evidence.checks.find(item => item.name === "enforce-target" && item.head_sha === pr.head.sha &&
                item.status === "completed" && item.conclusion === "success" && Number(item.app?.id) === 15368);
              if (target) return;
              const fresh = await getPr(pr.number);
              if (fresh.state !== "open" || fresh.head.sha !== pr.head.sha || fresh.base.ref !== "dev") return;
              await github.rest.actions.createWorkflowDispatch({
