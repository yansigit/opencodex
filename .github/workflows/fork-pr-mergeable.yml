name: Fork PR Mergeable

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

permissions:
  contents: read

jobs:
  mergeable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check GitHub mergeability
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_MERGEABLE: ${{ toJSON(github.event.pull_request.mergeable) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          mergeable="$INITIAL_MERGEABLE"
          attempts=0

          while [ "$mergeable" = "null" ] && [ "$attempts" -lt 3 ]; do
            attempts=$((attempts + 1))
            sleep 10
            mergeable="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.mergeable')"
          done

          if [ "$mergeable" = "null" ]; then
            echo "GitHub has not computed mergeability"
            exit 1
          fi

          if [ "$mergeable" = "false" ]; then
            echo "GitHub reports this pull request is not mergeable (dirty)"
            exit 1
          fi

          if [ "$mergeable" != "true" ]; then
            echo "GitHub returned an unknown mergeability state: $mergeable"
            exit 1
          fi

      - name: Check base ancestry
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -eu
          git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          if ! git merge-base --is-ancestor "origin/$BASE_REF" HEAD; then
            echo "The pull request head is not a descendant of origin/$BASE_REF"
            if [ "$BASE_REF" = main ] && [ "$HEAD_REF" = dev ]; then
              echo "Protected dev reconciliation must finish before this promotion can merge."
              echo "Do not use GitHub's Update branch button; it cannot write directly to protected dev."
            else
              echo "Recovery: merge the base into the pull request branch before retrying."
            fi
            echo "Never ask the human to resolve GitHub's 3-way of a disconnected rebuild."
            exit 1
          fi
