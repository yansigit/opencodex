name: Fork PR Mergeable

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  mergeable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun for trusted preservation verifier
        if: startsWith(github.head_ref, 'sync/')
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Check GitHub mergeability
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_MERGEABLE: ${{ toJSON(github.event.pull_request.mergeable) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          mergeable="$INITIAL_MERGEABLE"
          attempts=0

          while [ "$mergeable" = "null" ] && [ "$attempts" -lt 3 ]; do
            attempts=$((attempts + 1))
            sleep 10
            mergeable="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.mergeable')"
          done

          if [ "$mergeable" = "null" ]; then
            echo "GitHub has not computed mergeability"
            exit 1
          fi

          if [ "$mergeable" = "false" ]; then
            echo "GitHub reports this pull request is not mergeable (dirty)"
            exit 1
          fi

          if [ "$mergeable" != "true" ]; then
            echo "GitHub returned an unknown mergeability state: $mergeable"
            exit 1
          fi

      - name: Check base ancestry
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -eu
          git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          if ! git merge-base --is-ancestor "origin/$BASE_REF" HEAD; then
            echo "The pull request head is not a descendant of origin/$BASE_REF"
            if [ "$BASE_REF" = main ] && [ "$HEAD_REF" = dev ]; then
              echo "Protected dev reconciliation must finish before this promotion can merge."
              echo "Do not use GitHub's Update branch button; it cannot write directly to protected dev."
            else
              echo "Recovery: merge the base into the pull request branch before retrying."
            fi
            echo "Never ask the human to resolve GitHub's 3-way of a disconnected rebuild."
            exit 1
          fi

      - name: Preservation overlap check for sync PR
        if: startsWith(github.head_ref, 'sync/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Pull request SHAs are malformed"
            exit 1
          fi
          # A synchronize event snapshots the old body before the sync publisher can
          # attach exact-head evidence. Read the live PR so the gate sees an attestation
          # added moments later, while still binding it to this workflow's immutable head.
          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          live_head="$(printf '%s' "$pr_json" | jq -r '.head.sha // empty')"
          if [[ ! "$live_head" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Live pull request head SHA is malformed"
            exit 1
          fi
          if [ "$live_head" != "$HEAD_SHA" ]; then
            echo "Pull request advanced to $live_head; this $HEAD_SHA run is superseded."
            exit 0
          fi
          PR_BODY="$(printf '%s' "$pr_json" | jq -r '.body // ""')"
          provenance="$(printf '%s\n' "$PR_BODY" | sed -n 's/^<!-- opencodex-fork-sync-provenance:\(.*\) -->$/\1/p' | tail -n 1)"
          if ! printf '%s' "$provenance" | jq -e . >/dev/null 2>&1; then
            echo "::error::Missing or malformed exact-head preservation provenance"
            exit 1
          fi
          upstream="$(printf '%s' "$provenance" | jq -r '.tagSha // empty')"
          base="$(printf '%s' "$provenance" | jq -r '.baseSha // empty')"
          if [[ ! "$upstream" =~ ^[0-9a-fA-F]{40}$ ]] || [[ ! "$base" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Preservation ancestry SHAs are malformed"
            exit 1
          fi

          trusted="$RUNNER_TEMP/trusted-fork-sync"
          git worktree add --detach "$trusted" "$BASE_SHA"
          verifier="$trusted/scripts/fork/sync/cli.ts"
          # Both executable policy and baseline registry come from the trusted base;
          # sync PR-supplied release registrations and evidence are validated against it.
          tag="$(jq -r --arg sha "$upstream" '.releases | to_entries[] | select(.value.tagSha == $sha) | .value.tag' "$trusted/docs/fork/PRESERVATION.json" | head -n 1)"
          if [ -z "$tag" ]; then
            tag="$(git show "$upstream:package.json" 2>/dev/null | jq -r 'select(.version != null) | "v" + .version' || true)"
          fi
          if [ -z "$tag" ]; then
            echo "::error::Preservation provenance does not identify a registered upstream release"
            exit 1
          fi

          verify_input="$(jq -n \
            --arg base "$base" --arg fork "$BASE_SHA" --arg upstream "$upstream" \
            --arg merge "$HEAD_SHA" --arg dev "$BASE_SHA" --arg tag "$tag" \
            --argjson provenance "$provenance" \
            '{base:$base,fork:$fork,upstream:$upstream,merge:$merge,dev:$dev,tag:$tag,provenance:$provenance}')"
          printf '%s\n' "$verify_input" \
            | FORK_SYNC_WORKTREE="$GITHUB_WORKSPACE" \
              FORK_SYNC_TRUSTED_REGISTRY="$trusted/docs/fork/PRESERVATION.json" \
              bun "$verifier" verify
