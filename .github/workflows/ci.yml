name: Cross-platform CI

on:
  # Always create the aggregate `ci` check for pull requests. Expensive jobs
  # apply the former path allowlist through the `changes` job below, so a
  # docs-only PR receives explicit positive evidence instead of no check at all.
  pull_request: {}
    # No base-branch filter on purpose. GitHub matches `branches:` against the
    # BASE ref, so `[main, dev]` silently excluded stacked child PRs — whose
    # base is another open PR's head branch, an intentional review workflow per
    # AGENTS.md that `enforce-target` already exempts from the wrong-base gate.
    # The #951-#955 stack merged with `enforce-target`, `label`, and
    # `react-doctor` as its only check-runs: no test job ever queued for 24
    # changed files under `src/`.
    #
    # An allowlist cannot express "base is another PR's head" — stacked bases
    # carry contributor prefixes (`fix/`, `feat/`, `agent/`) as readily as
    # `codex/`, and contributor stacks need CI most. The `changes` job below is
    # the real scope gate, using the same allowlist as the push trigger. Safe to
    # widen here
    # because this workflow is `pull_request` (not `pull_request_target`),
    # declares `contents: read`, and reads no secrets.
    #
    # Every integration push needs an exact-head aggregate check for promotion
    # and release evidence. The `changes` job below keeps expensive work scoped.
  # Merge queue candidates are synthetic commits. They must produce the same
  # stable `ci` check as pull requests, but their changed-file range comes from
  # the payload's immutable base/head SHAs rather than the moving queue ref.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, preview, dev]
  workflow_dispatch:

permissions:
  contents: read

# Retrigger CI after dir-fsync / oauth deadline follow-ups (tip 34a1ac46).
concurrency:
  # Keep identities distinct by event. Merge-queue candidates use their
  # immutable synthetic SHA; pull requests share a number so a new commit
  # supersedes the obsolete run; pushes share a branch ref; manual dispatches
  # get an independent run identity.
  group: cross-platform-ci-${{ github.event_name }}-${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.event_name == 'workflow_dispatch' && github.run_id || github.run_id }}
  # Candidate evidence must finish. New PR commits and pushes supersede stale
  # runs, while merge-queue and manually dispatched runs are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  # Which areas this push actually touches.
  #
  # Deliberately a job-level filter rather than a wider workflow-level `paths:`
  # one. A workflow skipped by path filtering leaves its checks Pending forever,
  # so a PR requiring them can never merge; a skipped *job* reports success.
  # That asymmetry is the whole reason this job exists instead of more entries
  # in the `on:` block above.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The workflow grants only `contents: read`, and specifying any permission
    # sets every unspecified one to `none`. paths-filter reads the PR's file list
    # through the API on `pull_request`, so without this it fails outright — and
    # a failed filter produces empty outputs, which every `== 'true'` condition
    # below would read as "nothing changed, skip".
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      # Downstream jobs consume only the value re-emitted by the validation
      # step. A missing or malformed filter output must fail this job instead
      # of silently making every expensive job skip.
      ci: ${{ steps.scope.outputs.ci }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      reuse_dependency_audit: ${{ steps.promotion-audit.outputs.reuse }}
      gui: ${{ steps.scope.outputs.gui }}
      packaging: ${{ steps.scope.outputs.packaging }}
      macos: ${{ steps.scope.outputs.macos }}
      swift: ${{ steps.scope.outputs.swift }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # No job here pushes, so leaving a usable token in .git/config is
          # avoidable residue. Matches the other workflows.
          persist-credentials: false
          # The promotion audit verifier needs both parents of the main merge.
          fetch-depth: 2

      - name: Detect changed areas
        id: filter
        if: github.event_name != 'merge_group'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Without this the action compares against the repository's DEFAULT
          # branch, which is `main`. A push to `dev` would then be diffed against
          # `main`, so every area touched since the last promotion keeps reading
          # as "changed" — the scoped jobs would run on nearly every dev push and
          # the saving would silently not happen while CI stayed green.
          #
          # paths-filter ignores `base` and uses the API file list for a pull
          # request. On pushes this preserves the previous ref comparison.
          base: ${{ github.ref }}
          filters: .github/policies/ci-paths.yml

      - name: Detect merge queue changed areas
        id: merge-group-filter
        if: github.event_name == 'merge_group'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Never infer this range from the moving gh-readonly-queue ref. The
          # merge_group webhook supplies the immutable synthetic head and the
          # exact base commit against which this candidate was constructed.
          base: ${{ github.event.merge_group.base_sha }}
          ref: ${{ github.event.merge_group.head_sha }}
          filters: .github/policies/ci-paths.yml

      - name: Assert the scope output is usable
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          NORMAL_CI_SCOPE: ${{ steps.filter.outputs.ci }}
          NORMAL_DEPENDENCIES_SCOPE: ${{ steps.filter.outputs.dependencies }}
          NORMAL_GUI_SCOPE: ${{ steps.filter.outputs.gui }}
          NORMAL_PACKAGING_SCOPE: ${{ steps.filter.outputs.packaging }}
          NORMAL_MACOS_SCOPE: ${{ steps.filter.outputs.macos }}
          NORMAL_SWIFT_SCOPE: ${{ steps.filter.outputs.swift }}
          MERGE_GROUP_CI_SCOPE: ${{ steps.merge-group-filter.outputs.ci }}
          MERGE_GROUP_DEPENDENCIES_SCOPE: ${{ steps.merge-group-filter.outputs.dependencies }}
          MERGE_GROUP_GUI_SCOPE: ${{ steps.merge-group-filter.outputs.gui }}
          MERGE_GROUP_PACKAGING_SCOPE: ${{ steps.merge-group-filter.outputs.packaging }}
          MERGE_GROUP_MACOS_SCOPE: ${{ steps.merge-group-filter.outputs.macos }}
          MERGE_GROUP_SWIFT_SCOPE: ${{ steps.merge-group-filter.outputs.swift }}
        run: |
          set -euo pipefail
          prefix=NORMAL
          [ "$EVENT_NAME" = merge_group ] && prefix=MERGE_GROUP
          for scope in ci dependencies gui packaging macos swift; do
            name="${prefix}_${scope^^}_SCOPE"
            value="${!name-}"
            case "$value" in
              true|false) printf '%s=%s\n' "$scope" "$value" >> "$GITHUB_OUTPUT" ;;
              *) printf '::error::%s was %q, expected true or false\n' "$name" "$value"; exit 1 ;;
            esac
          done

      - name: Verify reusable promotion audit evidence
        id: promotion-audit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DEPENDENCIES_CHANGED: ${{ steps.scope.outputs.dependencies }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/promotion-audit-reuse.cjs

  # The general suite retains fresh-process containment after direct native
  # sharding failed qualification. The lane manifest is authoritative for
  # membership; validated Bun 1.4 timings only drive longest-processing-time
  # allocation. The batching helper remains the process boundary.
  #
  # Only the suite lives here. Typecheck, lint, build, and the scans run once in
  # `gates` rather than four times — they are fixed cost, and paying it per shard
  # would eat what the sharding saves.
  test:
    name: test ${{ matrix.shard }}/4
    needs: changes
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    # A quarter of the suite. A shard that needs longer than this is wedged, not
    # slow — the old 30-minute ceiling was margin for the Windows leg, which no
    # longer runs here (see platform-windows).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # No job here pushes, so leaving a usable token in .git/config is
          # avoidable residue. Matches the other workflows.
          persist-credentials: false
          # tests/release-version-line.test.ts compares package.json against the
          # newest release tag. actions/checkout fetches no tags by default, so
          # without this the check reads an empty tag set and passes on anything -
          # the exact regression it exists to catch would ride through CI green.
          #
          # Tags only, not full history: `fetch-depth: 0` would clone every commit to
          # answer a question about refs. A shallow fetch still brings each tag and its
          # target commit, which is all the check reads - the tag list, and whether the
          # newest tag names HEAD. That second read only happens on a release commit,
          # where the tag points at HEAD and the commit is present by definition.
          fetch-tags: true

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      # The GUI install is NOT optional here, however unrelated it looks to a
      # test shard. Several files under tests/ import JSX-bearing modules from
      # gui/src (ProviderRail and friends), and React is declared only in
      # gui/package.json. Without this the affected shards die on
      # `Cannot find module 'react/jsx-dev-runtime'` while the other shards pass.
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile

      # Nor is the build. Tests that fetch the served dashboard read the session
      # bootstrap meta tags out of `gui/dist/index.html`, so without a build the
      # server has no index to serve and those assertions see an empty string.
      # The old three-platform job happened to satisfy this because every leg ran
      # the GUI build as part of the same job; splitting the suite away from the
      # gates removed that coincidence, so the dependency has to be explicit.
      - name: Build GUI
        run: |
          cd gui
          bun run build

      - name: Restore canonical test timings
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .bun-timings.json
          key: ocx-test-timings-dev-${{ github.sha }}
          restore-keys: |
            ocx-test-timings-dev-

      - name: Validate restored timing data
        if: hashFiles('.bun-timings.json') != ''
        run: bun scripts/ci/validate-timings.ts .bun-timings.json --discard-invalid

      - name: Test in fresh-process timing-aware batches
        shell: bash
        env:
          TEST_SHARD: ${{ matrix.shard }}/4
        run: |
          bash scripts/ci/run-bun-test-batches.sh "$TEST_SHARD"

      - name: Upload trusted-dev shard timing report
        if: >-
          success() && github.event_name == 'push' && github.ref == 'refs/heads/dev' &&
          hashFiles('.bun-timings.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-timings-general-${{ matrix.shard }}
          path: .bun-timings.json
          include-hidden-files: true
          if-no-files-found: error

  # Bun 1.3.14 has shown a Linux isolate/epoll race around the storage-policy
  # harness. Keep the entire six-file family in one fresh process so a runtime
  # failure is bounded to this job instead of poisoning a general test shard.
  storage-policy:
    name: storage policy
    needs: changes
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile

      - name: Build GUI
        run: |
          cd gui
          bun run build

      - name: Test storage policy API
        run: |
          mapfile -t dedicated_files < <(bun scripts/ci/test-lanes.ts --lane dedicated-storage)
          bun scripts/test.ts --isolate "${dedicated_files[@]}"

  # Bun 1.3.14 has shown a Linux isolate wedge around startServer() plus the user
  # cost overlay reconciler. Keep api-usage in one fresh process so a runtime
  # failure is bounded to this job instead of poisoning a general test shard.
  api-usage:
    name: api usage
    needs: changes
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile

      - name: Build GUI
        run: |
          cd gui
          bun run build

      - name: Test api usage API
        run: |
          mapfile -t dedicated_files < <(bun scripts/ci/test-lanes.ts --lane dedicated-api)
          bun scripts/test.ts --isolate "${dedicated_files[@]}"

  serial-load-sensitive:
    name: serial load-sensitive tests
    needs: changes
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-tags: true

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile

      - name: Build GUI
        run: |
          cd gui
          bun run build

      - name: Test serial lane
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t serial_files < <(bun scripts/ci/test-lanes.ts --lane serial)
          bun scripts/test.ts --isolate --parallel=1 "${serial_files[@]}"

  # Only trusted dev pushes may turn the four partial reports into the one
  # canonical timing cache. PRs and release branches can restore that cache,
  # but never publish data under a key they could later restore.
  publish-test-timings:
    name: publish test timings
    needs: test
    if: >-
      needs.test.result == 'success' && github.event_name == 'push' &&
      github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Download trusted-dev shard timing reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-timings-general-*
          path: .tmp/ci-timings

      - name: Merge and validate timing reports
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t timing_files < <(find .tmp/ci-timings -type f -name .bun-timings.json -print)
          test "${#timing_files[@]}" -eq 4
          bun scripts/ci/merge-timings.ts "${timing_files[@]}"
          bun scripts/ci/validate-timings.ts .bun-timings.json

      - name: Save canonical dev timing cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .bun-timings.json
          key: ocx-test-timings-dev-${{ github.sha }}

  # Everything that is not the suite: type safety, privacy, lint, build, smoke.
  # One runner, once per push. Splitting these across the shards would repeat a
  # fixed couple of minutes four times to save nothing.
  gates:
    name: gates
    needs: changes
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # No job here pushes, so leaving a usable token in .git/config is
          # avoidable residue. Matches the other workflows.
          persist-credentials: false

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile

      - name: Dependency audit (high severity)
        id: dependency-audit
        if: needs.changes.outputs.dependencies == 'true' && needs.changes.outputs.reuse_dependency_audit != 'true'
        run: bun run audit:high

      - name: Create dependency audit proof
        id: dependency-audit-proof
        if: github.event_name == 'pull_request' && steps.dependency-audit.outcome == 'success'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          audited_tree="$(git rev-parse 'HEAD^{tree}')"
          proof_name="dependency-audit-pr-${PR_NUMBER}-base-${BASE_SHA}-head-${HEAD_SHA}-tree-${audited_tree}"
          mkdir -p .tmp/dependency-audit-proof
          printf '%s\n' "$proof_name" > .tmp/dependency-audit-proof/evidence.txt
          printf 'name=%s\n' "$proof_name" >> "$GITHUB_OUTPUT"

      - name: Publish dependency audit proof
        if: steps.dependency-audit-proof.outcome == 'success'
        # Artifact availability affects only later reuse. The audit itself has
        # already passed, so an artifact outage must withhold reuse, not turn
        # this PR red; main then falls back to its own live fail-closed audit.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.dependency-audit-proof.outputs.name }}
          path: .tmp/dependency-audit-proof/evidence.txt
          if-no-files-found: error
          retention-days: 1

      - name: Validate GitHub Actions workflows
        run: bun run lint:workflows

      - name: Validate repository workflow policy
        run: bun scripts/ci/check-workflow-policy.ts

      - name: GUI lint
        if: needs.changes.outputs.gui == 'true'
        run: |
          cd gui
          bun run lint

      - name: Typecheck
        run: |
          bun x tsc --noEmit
          bun x tsc --noEmit -p tests/tsconfig.doctor-service-memory-contract.json

      - name: Install replit-gateway companion
        run: cd integrations/replit-gateway && bun install --frozen-lockfile

      - name: Replit gateway typecheck
        run: cd integrations/replit-gateway && bun run typecheck

      - name: Replit gateway tests
        run: cd integrations/replit-gateway && bun run test

      - name: GUI tests
        run: cd gui && bun test --isolate tests

      - name: Privacy scan
        run: bun run privacy:scan

      # The ocx skill ships a capability -> route map generated from src/cli/capabilities.ts.
      # `bun run test` already covers this via tests/skill-ocx.test.ts; this step exists so the
      # failure names the fix instead of surfacing as a byte-comparison diff in a test log.
      - name: Check the generated ocx skill surface is current
        run: bun run skill:surface:check

      - name: Check release helper syntax
        run: bun build scripts/release.ts --target=bun --outdir=.tmp/ci-release-script-check

      - name: GUI build
        if: needs.changes.outputs.gui == 'true'
        run: |
          cd gui
          bun run build

      - name: CLI help smoke
        run: bun run src/cli/index.ts help

  # macOS is focused on dev pushes and relevant pull requests, while main,
  # preview, and dispatch retain the full unsharded control. This keeps Darwin
  # process coverage on the fast path without dropping the release control.
  platform-macos:
    name: macos
    needs: changes
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') ||
      needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    # The unsharded control for the sharded Linux lane: the only place the whole
    # suite runs in one pool, so it is the place that catches what sharding
    # hides. The flakes it keeps surfacing are timing, not logic, and the fix
    # is the tests, not a fourth lane.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # No job here pushes, so leaving a usable token in .git/config is
          # avoidable residue. Matches the other workflows.
          persist-credentials: false
          # tests/release-version-line.test.ts compares package.json against the
          # newest release tag. actions/checkout fetches no tags by default, so
          # without this the check reads an empty tag set and passes on anything -
          # the exact regression it exists to catch would ride through CI green.
          #
          # Tags only, not full history: `fetch-depth: 0` would clone every commit to
          # answer a question about refs. A shallow fetch still brings each tag and its
          # target commit, which is all the check reads - the tag list, and whether the
          # newest tag names HEAD. That second read only happens on a release commit,
          # where the tag points at HEAD and the commit is present by definition.
          fetch-tags: true

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile

      # Same reason as the shards: the suite serves gui/dist and reads it back.
      - name: Build GUI
        run: |
          cd gui
          bun run build

      - name: Restore canonical test timings
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .bun-timings.json
          key: ocx-test-timings-dev-${{ github.sha }}
          restore-keys: |
            ocx-test-timings-dev-

      - name: Validate restored timing data
        if: hashFiles('.bun-timings.json') != ''
        run: bun scripts/ci/validate-timings.ts .bun-timings.json --discard-invalid

      - name: Swift/WebKit integration
        if: >-
          needs.changes.outputs.swift == 'true' &&
          (github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/dev'))
        run: bash scripts/ci/run-bun-with-crash-retry.sh -- bun scripts/test.ts --isolate --timeout 60000 tests/aistudio-native-webkit.test.ts

      - name: Focused Darwin/process lifecycle tests
        if: >-
          github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/dev')
        run: |
          bash scripts/ci/run-bun-with-crash-retry.sh -- bun scripts/test.ts --isolate --timeout 60000 \
            --timings .bun-timings.json --update-timings \
            tests/codex-app-server-processes.test.ts \
            tests/codex-prompt-text-probe.test.ts \
            tests/cursor-native-exec-shell.test.ts \
            tests/process-control.test.ts \
            tests/process-state.test.ts \
            tests/service.test.ts \
            tests/storage-worker-lifecycle.test.ts \
            tests/storage-worker-os-join-settle.test.ts \
            tests/storage-worker-teardown-isolate.test.ts \
            tests/test-runner.test.ts

      - name: Full macOS suite
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.base_ref == 'main') ||
          (github.event_name == 'merge_group' &&
           github.event.merge_group.base_ref == 'refs/heads/main') ||
          (github.event_name == 'push' &&
           (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview'))
        run: bash scripts/ci/run-bun-with-crash-retry.sh -- bun scripts/test.ts --timeout 60000

      - name: CLI help smoke
        run: bun run src/cli/index.ts help

  # Windows is a required shipping-platform gate on integration pushes and on
  # pull requests that touch CI-relevant code. Documentation-only pull requests
  # may skip it through the same `changes` decision used by the Linux shards.
  #
  # It left the PR lane first (16m23s against a 6-minute Linux critical path;
  # the ceiling was raised twice rather than the gap closed — #711 vs #653,
  # issue #717, then #827's 20-minute kill), then left the shipping boundary
  # when the sharded promotion run surfaced ~207 Windows-only test failures
  # that had been invisible while dev skipped the leg. Those are real defects,
  # tracked as issue #1059, but they are pre-existing on every released
  # version — gating the release on them blocks shipping fixes to the platforms
  # that pass, for a platform that has never shipped green.
  #
  # The tracked portability failures are fixed and the four hosted shards are
  # green again. Keep the leg sharded and bounded: removing it from ordinary
  # pushes is what allowed the Windows-only backlog to accumulate unnoticed.
  platform-windows:
    name: windows ${{ matrix.shard }}/6
    needs: [changes]
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
      needs.changes.outputs.ci == 'true'
    # Public pull-request code must never reach a persistent self-hosted host.
    # Keep the complete Windows lane on an ephemeral GitHub-hosted runner for
    # every event, including trusted pushes, so event-routing drift cannot turn
    # a repository workflow edit into host access.
    runs-on: windows-latest
    # Sharded like the Linux legs. The single-leg run reached 30 minutes on a
    # green suite and was killed in cleanup; four shards put each leg inside the
    # same budget the Linux shards already hold.
    #
    # 15 was that Linux budget, and on this leg it truncated the evidence rather
    # than bounding a hang: shard 1/4 of run 32340498394 was CANCELLED at exactly
    # 15m12s while still executing tests, so its result was neither pass nor fail
    # and the composed-acceptance cases it carries could not be read at all. The
    # other shards finished in 14-15 minutes, which is the wrong side of the
    # margin. 25 leaves the outer bound in place — a wedged shard still dies —
    # while making a completed shard the normal outcome. The crash-retry below can
    # double a shard's work, and this ceiling has to cover that second attempt too.
    # Four shards later grew back into that ceiling as the suite expanded. Six
    # shards reduce each hosted-Windows process's filesystem, Worker, and child
    # process pressure without raising the ceiling or weakening assertions.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # No job here pushes, so leaving a usable token in .git/config is
          # avoidable residue. Matches the other workflows.
          persist-credentials: false
          # Same reason as the Linux shards and the macOS control: this leg runs the
          # whole suite, and tests/release-version-line.test.ts reads release tags.
          # Without tags the check sees an empty set and cannot fail.
          fetch-tags: true

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile

      # Same reason as the shards: the suite serves gui/dist and reads it back.
      - name: Build GUI
        run: |
          cd gui
          bun run build

      - name: Restore canonical test timings
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .bun-timings.json
          key: ocx-test-timings-dev-${{ github.sha }}
          restore-keys: |
            ocx-test-timings-dev-

      - name: Validate restored timing data
        if: hashFiles('.bun-timings.json') != ''
        run: bun scripts/ci/validate-timings.ts .bun-timings.json --discard-invalid

      - name: Test
        # --timeout: the Linux batches and the macOS control both pass 60000; this leg was
        # the only one left on Bun's 5s default, and it is the slowest hardware on the board.
        # Three of its failures were the default firing on tests that had not hung — the
        # composed-acceptance cases spawn a real `ocx start` and were still working at 41s.
        #
        # The retry is the same one the macOS leg already carries, for the same reason: a Bun
        # runtime panic is a crash in the interpreter, not a test result, and failing the shard
        # on it reports a defect this repository does not have (#2152). An ordinary assertion
        # failure returns its status immediately — only the crash signatures below are retried,
        # and only once, so a genuinely broken build cannot be retried into green.
        #
        # Every shard owns one ephemeral GitHub-hosted VM and this step invokes its
        # test runners sequentially. There is no peer process to queue behind, so
        # resolving and ACL-hardening the desktop-grade per-user lock adds no safety.
        # More importantly, that resolution starts PowerShell before any test can
        # run; under hosted contention the bounded SID lookup has timed out and
        # discarded an otherwise usable shard. Keep the local/multi-worktree lock
        # fail-closed, while explicitly using its documented no-queue mode inside
        # this isolated single-owner CI boundary.
        env:
          OCX_TEST_NO_QUEUE: "1"
        shell: bash
        run: |
          set +e
          set -uo pipefail
          suite_log="$(mktemp -t ocx-windows-suite.XXXXXX)"
          timing_args=()
          if [ -f .bun-timings.json ]; then
            timing_args=(--timings .bun-timings.json)
          fi
          general_list="$(mktemp -t ocx-windows-general.XXXXXX)"
          serial_list="$(mktemp -t ocx-windows-serial.XXXXXX)"
          if ! bun scripts/ci/test-lanes.ts --lane general "${timing_args[@]}" --shard ${{ matrix.shard }}/6 > "$general_list"; then
            echo "::error::Windows general lane selection failed."
            exit 1
          fi
          if ! bun scripts/ci/test-lanes.ts --lane serial "${timing_args[@]}" --shard ${{ matrix.shard }}/6 > "$serial_list"; then
            echo "::error::Windows serial lane selection failed."
            exit 1
          fi
          mapfile -t general_files < "$general_list"
          mapfile -t serial_files < "$serial_list"
          rm -f "$general_list" "$serial_list"
          if [ "${#general_files[@]}" -eq 0 ] || [ "${#serial_files[@]}" -eq 0 ]; then
            echo "::error::Windows lane selection returned an empty shard."
            exit 1
          fi
          for attempt in 1 2; do
            : > "$suite_log"
            bun scripts/test.ts --isolate --timeout 60000 "${general_files[@]}" 2>&1 | tee "$suite_log"
            suite_status="${PIPESTATUS[0]}"
            if [ "$suite_status" -eq 0 ]; then
              # Each process-heavy serial file gets a fresh Bun runner. `--isolate`
              # resets test globals, but one multi-file Bun process can still retain
              # runtime/handle pressure before the next file spawns its own children.
              for serial_file in "${serial_files[@]}"; do
                serial_timeout=60000
                if [[ "$serial_file" == "tests/codex-composed-acceptance.test.ts" ]]; then
                  # Case E starts two real lock children. Each resolves its
                  # effective-token namespace through bounded PowerShell calls,
                  # so the file's 240s case budget must not be preempted by the
                  # general 60s per-test ceiling. The extra minute lets the test
                  # report its own deadline instead of racing Bun's outer kill.
                  serial_timeout=300000
                fi
                bun scripts/test.ts --isolate --parallel=1 --timeout "$serial_timeout" "$serial_file" 2>&1 | tee -a "$suite_log"
                suite_status="${PIPESTATUS[0]}"
                if [ "$suite_status" -ne 0 ]; then
                  break
                fi
              done
            fi
            if [ "$suite_status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eqi 'oh no: Bun has crashed|Internal assertion failure|Segmentation fault at address|Illegal instruction|Bus error|Aborted \(core dumped\)' "$suite_log"; then
              echo "::error::Windows shard ${{ matrix.shard }}/6 failed on attempt ${attempt} (exit ${suite_status}); assertion failures are not retried."
              exit "$suite_status"
            fi
            echo "::warning::Bun runtime crash in Windows shard ${{ matrix.shard }}/6 (exit ${suite_status}, attempt ${attempt})."
          done
          echo "::error::Bun runtime crash repeated on Windows shard ${{ matrix.shard }}/6; failing after one retry."
          exit 1

      - name: CLI help smoke
        run: bun run src/cli/index.ts help

  # Keep every OS credential-store check on a disposable GitHub-hosted machine.
  # A force-cancelled process cannot run its in-process finally cleanup, so no
  # keyring matrix leg may use a persistent runner.
  keyring-smoke:
    name: keyring ${{ matrix.name }}
    needs: changes
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
      needs.changes.outputs.ci == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            runner: ubuntu-latest
          - name: windows
            runner: windows-latest
          - name: macos
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Linux hosted runners do not provide an unlocked desktop keyring session.
      # Run Secret Service with temporary state instead of skipping Linux.
      - name: Install Secret Service dependencies (Linux)
        if: matrix.name == 'ubuntu'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus-x11 gnome-keyring

      - name: OS keyring create/read/delete smoke
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" != "Linux" ]; then
            bun run scripts/keyring-smoke.ts
            exit 0
          fi

          keyring_home="$(mktemp -d)"
          runtime_dir="$(mktemp -d)"
          cleanup() { rm -rf -- "$keyring_home" "$runtime_dir"; }
          trap cleanup EXIT
          chmod 700 "$keyring_home" "$runtime_dir"
          HOME="$keyring_home" XDG_RUNTIME_DIR="$runtime_dir" dbus-run-session -- bash -euo pipefail -c '
            # Create and unlock the isolated login keyring without putting its
            # ephemeral password in argv, the environment, or the job log.
            od -An -N32 -tx1 /dev/urandom |
              tr -d "[:space:]" |
              gnome-keyring-daemon --unlock --components=secrets >/dev/null
            bun run scripts/keyring-smoke.ts
          '

  npm-global-smoke:
    name: npm-global ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        # Keep global-install smoke on disposable hosted machines: it writes
        # into the machine's global prefix and must not leave state behind.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # No job here pushes, so leaving a usable token in .git/config is
          # avoidable residue. Matches the other workflows.
          persist-credentials: false

      # Deliberately NO setup-bun: prove `npm install -g` works without a
      # separately-installed Bun. The launcher uses the bundled `bun` dependency.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install package dependencies
        run: npm install

      - name: Build package assets
        run: npm run build:gui

      - name: Pack
        shell: bash
        run: npm pack --json > pack.json

      - name: Verify packed GUI asset
        run: node -e "const p=require('./pack.json')[0]; if (!p.files.some(f => f.path === 'gui/dist/index.html')) { console.error('missing gui/dist/index.html in npm pack'); process.exit(1); }"

      - name: Install globally (downloads bundled bun)
        shell: bash
        run: npm install -g "./$(node -p "require('./pack.json')[0].filename")"

      - name: ocx help via bundled bun
        run: ocx help

  # The one check name that means "CI passed".
  #
  # Shard names move whenever the shard count changes, and the platform legs come
  # and go by trigger. Neither is a stable thing to require in branch protection.
  # This job is: it depends on every other job and asserts each result. `dev` has
  # no branch protection configured today, so nothing has to be re-pointed — but
  # whoever enables it has one obvious check to require.
  #
  # Pull requests always trigger this workflow. The `changes` job keeps
  # expensive jobs scoped, but this aggregate still records explicit success
  # when every producer is deliberately skipped for an out-of-scope docs change.
  #
  # `if: always()` is load-bearing. Without it, a failed or skipped dependency
  # skips this job too — and GitHub reports a skipped job as success, so the gate
  # would go green precisely when something went wrong.
  ci:
    name: ci
    if: always()
    # Every producer, including the ones that only feed other jobs.
    needs: [changes, test, storage-policy, api-usage, serial-load-sensitive, publish-test-timings, gates, platform-macos, platform-windows, keyring-smoke, npm-global-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every needed job succeeded or was skipped
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
          WINDOWS_REQUIRED: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.outputs.ci == 'true' }}
          WINDOWS_RESULT: ${{ needs.platform-windows.result }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq .
          # Allowlist, not denylist. Anything that is not a known-good result
          # fails the gate, so a result GitHub adds later cannot pass silently.
          #
          # `skipped` is a pass on purpose: that is how a trigger-scoped job
          # (platform-windows on a pull request) reports when it is deliberately
          # not run.
          bad=$(echo "$RESULTS" | jq -r '
            to_entries
            | map(select(.value.result != "success" and .value.result != "skipped"))
            | .[] | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::needed job(s) did not pass: $bad"
            exit 1
          fi
          if [ "$WINDOWS_REQUIRED" = "true" ] && [ "$WINDOWS_RESULT" != "success" ]; then
            echo "::error::Windows was required but reported: $WINDOWS_RESULT"
            exit 1
          fi
