name: Release

# Publish opencodex to npm — triggered from the Actions tab with explicit inputs, or by the
# fork's audited stable-release dispatcher. Bump package.json on main BEFORE dispatching (or
# use `bun run release <version>`, which does the bump+commit+push+dispatch for you); the workflow
# verifies the version and exact commit before publishing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish — must equal package.json (e.g. 0.1.0)"
        required: true
        type: string
      tag:
        description: "npm dist-tag"
        required: true
        type: choice
        options:
          - latest
          - preview
          - dev
        default: latest
      dry-run:
        description: "Dry run (build + pack, no actual publish)"
        required: false
        type: boolean
        default: true
      expected-sha:
        description: "Immutable release commit this dispatch must publish (fail if the branch moved)"
        required: true
        type: string
      candidate-run-id:
        description: "Successful Build release candidate workflow run ID"
        required: false
        type: string
      candidate-artifact-id:
        description: "Immutable release candidate artifact ID from that run"
        required: false
        type: string
  repository_dispatch:
    types: [fork-auto-release]

permissions: {}

env:
  DISPATCH_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.version || inputs.version }}
  DISPATCH_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || inputs.tag }}
  DISPATCH_EXPECTED_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.expected_sha || inputs.expected-sha }}
  DISPATCH_DRY_RUN: ${{ github.event_name == 'repository_dispatch' && 'false' || inputs.dry-run }}
  DISPATCH_CANDIDATE_RUN_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.candidate_run_id || inputs.candidate-run-id }}
  DISPATCH_CANDIDATE_ARTIFACT_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.candidate_artifact_id || inputs.candidate-artifact-id }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted dispatch guard
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: trusted-dispatch

      - name: Validate release dispatch
        env:
          EXPECTED_SHA: ${{ env.DISPATCH_EXPECTED_SHA }}
          DISPATCH_TAG: ${{ env.DISPATCH_TAG }}
          DISPATCH_DRY_RUN: ${{ env.DISPATCH_DRY_RUN }}
          CANDIDATE_RUN_ID: ${{ env.DISPATCH_CANDIDATE_RUN_ID }}
          CANDIDATE_ARTIFACT_ID: ${{ env.DISPATCH_CANDIDATE_ARTIFACT_ID }}
          EVENT_ACTION: ${{ github.event.action || '' }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const { validateReleaseDispatch } = require(
            "./trusted-dispatch/.github/scripts/release-dispatch-guard.cjs",
          );
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));

          const failure = validateReleaseDispatch({
            eventName: process.env.GITHUB_EVENT_NAME,
            eventAction: process.env.EVENT_ACTION,
            ref: process.env.GITHUB_REF,
            expectedSha: process.env.EXPECTED_SHA,
            actualSha: process.env.GITHUB_SHA,
            tag: process.env.DISPATCH_TAG,
            dryRun: process.env.DISPATCH_DRY_RUN,
            candidateRunId: process.env.CANDIDATE_RUN_ID,
            candidateArtifactId: process.env.CANDIDATE_ARTIFACT_ID,
            clientPayload: event.client_payload,
          });

          if (failure) {
            console.error(`::error::${failure}`);
            process.exit(1);
          }
          NODE
  publish:
    needs: validate-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.DISPATCH_EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and download immutable release candidate
        if: ${{ env.DISPATCH_CANDIDATE_RUN_ID != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ env.DISPATCH_EXPECTED_SHA }}
          DISPATCH_TAG: ${{ env.DISPATCH_TAG }}
          CANDIDATE_RUN_ID: ${{ env.DISPATCH_CANDIDATE_RUN_ID }}
          CANDIDATE_ARTIFACT_ID: ${{ env.DISPATCH_CANDIDATE_ARTIFACT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$EXPECTED_SHA" --arg release_event "$GITHUB_EVENT_NAME" --arg release_tag "$DISPATCH_TAG" \
            '(.repository.full_name == $repo) and (.head_sha == $sha) and (.status == "completed") and (.conclusion == "success") and (.name == "Build release candidate") and (.path == ".github/workflows/release-candidate.yml") and ((.event == "workflow_run") or (.event == "workflow_dispatch")) and (($release_event != "repository_dispatch") or ((.event == "workflow_run") and (.head_branch == "main"))) and (($release_tag != "latest") or (.head_branch == "main"))' \
            <<<"$run_json" >/dev/null || { echo "::error::candidate run is not a successful Build release candidate for the expected repository/SHA"; exit 1; }
          repo_id="$(jq -r '.repository.id' <<<"$run_json")"
          run_attempt="$(jq -r '.run_attempt' <<<"$run_json")"
          test "$run_attempt" -ge 1 || { echo "::error::candidate run attempt is invalid"; exit 1; }
          echo "CANDIDATE_RUN_ATTEMPT=$run_attempt" >> "$GITHUB_ENV"
          artifact_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}")"
          expected_name="release-candidate-${EXPECTED_SHA}"
          jq -e --arg repo_id "$repo_id" --arg sha "$EXPECTED_SHA" --arg name "$expected_name" --arg run "$CANDIDATE_RUN_ID" \
            '(.name == $name) and (.expired == false) and ((.workflow_run.id|tostring) == $run) and ((.workflow_run.repository_id|tostring) == $repo_id) and (.workflow_run.head_sha == $sha)' \
            <<<"$artifact_json" >/dev/null || { echo "::error::candidate artifact is not the unexpired expected artifact belonging to the verified run"; exit 1; }

      - name: Download immutable release candidate
        if: ${{ env.DISPATCH_CANDIDATE_RUN_ID != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.DISPATCH_CANDIDATE_ARTIFACT_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.DISPATCH_CANDIDATE_RUN_ID }}
          path: release-candidate

      - name: Verify dispatched SHA
        env:
          EXPECTED_SHA: ${{ env.DISPATCH_EXPECTED_SHA }}
        run: |
          if [ -z "$EXPECTED_SHA" ]; then
            echo "::error::expected-sha is required; refusing to publish without an audited commit"
            exit 1
          elif [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::branch moved after the release audit (expected ${EXPECTED_SHA}, got ${GITHUB_SHA}) — refusing to publish an unaudited commit"
            exit 1
          fi

      # opencodex is bun-native (the prepublishOnly audit, GUI build, and typecheck run under bun).
      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Verify candidate manifest, package bytes, and inputs
        id: candidate-package
        if: ${{ env.DISPATCH_CANDIDATE_RUN_ID != '' }}
        env:
          EXPECTED_SHA: ${{ env.DISPATCH_EXPECTED_SHA }}
          RELEASE_VERSION: ${{ env.DISPATCH_VERSION }}
          CANDIDATE_RUN_ID: ${{ env.DISPATCH_CANDIDATE_RUN_ID }}
          CANDIDATE_RUN_ATTEMPT: ${{ env.CANDIDATE_RUN_ATTEMPT }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="release-candidate/release-candidate.json"
          package_file="$(find release-candidate -maxdepth 1 -type f -name '*.tgz' -print)"
          test -f "$manifest" && test "$(printf '%s\n' "$package_file" | sed '/^$/d' | wc -l | tr -d ' ')" = 1 || { echo "::error::candidate must contain one manifest and one tarball"; exit 1; }
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          bun scripts/release-candidate.ts verify "$manifest" "$package_file" \
            --repository "$GITHUB_REPOSITORY" --sha "$EXPECTED_SHA" --tree "$tree_sha" --input-root "$GITHUB_WORKSPACE"
          node -e '
            const m=require("./release-candidate/release-candidate.json");
            const [name,version]=[m.package.name,m.package.version];
            if (version !== process.env.RELEASE_VERSION) throw new Error(`candidate version ${version} != ${process.env.RELEASE_VERSION}`);
            if (m.builder.workflow !== "Build release candidate" || m.builder.runId !== process.env.CANDIDATE_RUN_ID || String(m.builder.runAttempt) !== process.env.CANDIDATE_RUN_ATTEMPT) throw new Error("candidate builder provenance mismatch");
            if (!/^@[a-z0-9._~-]+\/[a-z0-9._~-]+$/.test(name)) throw new Error(`unexpected package name ${name}`);
            if (require("./package.json").name !== name) throw new Error("candidate package name differs from checked-out package.json");
          '
          echo "path=$package_file" >> "$GITHUB_OUTPUT"

      # node + npm perform the actual publish. registry-url points npm at the public registry.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (OIDC) needs npm >= 11.5.1. Node 24 runners already
      # provide a compatible npm; avoid replacing the bundled npm because global
      # npm self-updates can lose publish-time dependencies such as sigstore.
      - name: Verify npm version
        run: |
          npm_version="$(npm --version)"
          echo "npm=${npm_version}"
          # shellcheck disable=SC2016 # the node script deliberately avoids shell expansion
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5)) {
              console.error(`npm ${process.argv[1]} is too old for trusted publishing; need >= 11.5.1`);
              process.exit(1);
            }
          ' "$npm_version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit (high severity)
        run: bun run audit:high

      - name: Verify version matches package.json
        env:
          RELEASE_VERSION: ${{ env.DISPATCH_VERSION }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          echo "package.json=$PKG  input=${RELEASE_VERSION}"
          if [ -n "$DISPATCH_CANDIDATE_RUN_ID" ]; then
            test "$PKG" = "$RELEASE_VERSION" || {
              echo "::error::package.json ($PKG) != requested (${RELEASE_VERSION}) — build a candidate from a commit carrying the exact version";
              exit 1;
            }
          elif [ "$GITHUB_REF" = "refs/heads/dev" ] && [ "$PKG" != "$RELEASE_VERSION" ]; then
            echo "Setting package.json version to $RELEASE_VERSION for transitional dev publish"
            npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          else
            test "$PKG" = "$RELEASE_VERSION" || {
              echo "::error::package.json ($PKG) != requested (${RELEASE_VERSION}) — bump package.json first";
              exit 1;
            }
          fi

      # The exact-SHA CI gate includes the hosted Linux, Windows, and macOS
      # keyring smoke matrix. Do not duplicate its Linux bootstrap here.
      - name: Require successful Cross-platform CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ env.DISPATCH_VERSION }}
          NPM_DIST_TAG: ${{ env.DISPATCH_TAG }}
        run: |
          set -euo pipefail

          case "$GITHUB_REF" in
            refs/heads/main)
              expected_tag="latest"
              if [[ "$RELEASE_VERSION" == *-* ]]; then
                echo "::error::main releases must use a stable semver version; got ${RELEASE_VERSION}"
                exit 1
              fi
              ;;
            refs/heads/preview)
              expected_tag="preview"
              if [[ "$RELEASE_VERSION" != *-preview.* ]]; then
                echo "::error::preview releases must use a preview prerelease version; got ${RELEASE_VERSION}"
                exit 1
              fi
              ;;
            refs/heads/dev)
              expected_tag="dev"
              if [[ "$RELEASE_VERSION" != *-dev.* ]]; then
                echo "::error::dev releases must use a dev prerelease version; got ${RELEASE_VERSION}"
                exit 1
              fi
              ;;
            *)
              echo "::error::Release must run from main, preview, or dev; got ${GITHUB_REF}"
              exit 1
              ;;
          esac

          if [ "$NPM_DIST_TAG" != "$expected_tag" ]; then
            echo "::error::${GITHUB_REF#refs/heads/} releases must publish with npm dist-tag '${expected_tag}', got '${NPM_DIST_TAG}'"
            exit 1
          fi

          ci_url="$(
            gh run list \
              --workflow ci.yml \
              --branch "${GITHUB_REF#refs/heads/}" \
              --commit "$GITHUB_SHA" \
              --event push \
              --limit 10 \
              --json conclusion,url \
              --jq '[.[] | select(.conclusion == "success")][0].url // ""'
          )"

          if [ -z "$ci_url" ]; then
            # Deliberately narrower than "any successful ci.yml run for this SHA".
            # The release branch's own push run is the one whose trigger set,
            # runner selection, and job graph match what is being published —
            # a green PR run for the same SHA ran against a merge ref with a
            # different trigger context. Accepting it here would let a publish
            # proceed while the promotion run was still pending, or had failed.
            echo "::error::No successful Cross-platform CI run found for ${GITHUB_SHA} on ${GITHUB_REF#refs/heads/} (push event). A pull-request run does not qualify. Wait for the promotion run to pass before releasing."
            gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 10 || true
            exit 1
          fi

          echo "Cross-platform CI passed for ${GITHUB_SHA}: ${ci_url}"

          # Service baseline (lineage-relative): merged tags only, so the
          # changed-files gate compares against the last release actually
          # reachable from this commit. The release-notes baseline below uses the
          # full tag set instead, so a stable on another lineage can anchor the
          # changelog range.
          # - Preview: newest prior release of either channel (stable or preview). A
          #   preview→preview-only baseline skips a shipped stable and restates it.
          # - Stable: newest prior stable only (matching preview carry adjusts the
          #   generate-notes range separately below).
          previous_tag="$(
            git tag --merged HEAD --list 'v[0-9]*' |
              bun scripts/release-notes.ts previous-release-tag "$RELEASE_VERSION"
          )"
          if [ -n "$previous_tag" ]; then
            changed_files="$(git diff --name-only "${previous_tag}..HEAD")"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          fi

          # Keep in sync with the service-lifecycle.yml trigger paths. src/cli.ts is
          # the pre-restructure compat stub that durable launchers still execute.
          if printf '%s\n' "$changed_files" | grep -Eq '^(src/service\.ts|src/cli\.ts|src/cli/index\.ts|src/lib/bun-runtime\.ts|package\.json|bun\.lock|\.github/workflows/service-lifecycle\.yml|\.github/workflows/release\.yml)$'; then
            service_url="$(
              gh run list \
                --workflow service-lifecycle.yml \
                --commit "$GITHUB_SHA" \
                --limit 10 \
                --json conclusion,headSha,url,workflowName \
                --jq '[.[] | select(.conclusion == "success")][0].url // ""'
            )"
            if [ -z "$service_url" ]; then
              echo "::error::Service-related files changed since ${previous_tag:-initial commit}, but no successful Service lifecycle run was found for ${GITHUB_SHA}."
              gh run list --workflow service-lifecycle.yml --commit "$GITHUB_SHA" --limit 10 || true
              exit 1
            fi
            echo "Service lifecycle passed for ${GITHUB_SHA}: ${service_url}"
          fi

      # Tokenless publish via Trusted Publishing (OIDC) — NO NPM_TOKEN secret. Publish the verified
      # candidate tarball directly; npm must not repack or execute lifecycle scripts here.
      # PREREQUISITE: configure the Trusted Publisher for this repo + workflow on npmjs.com — possible
      # only AFTER the package's first version exists (do the first publish locally, see the runbook).
      - name: Preflight release metadata
        id: release-metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ env.DISPATCH_VERSION }}
          DRY_RUN: ${{ env.DISPATCH_DRY_RUN }}
        run: |
          set -euo pipefail

          pkg_name="$(node -p "require('./package.json').name")"
          release_tag="v${RELEASE_VERSION}"
          dry_run="$DRY_RUN"

          git fetch --force --tags origin

          existing_tag_sha="$(git rev-parse -q --verify "refs/tags/${release_tag}^{commit}" || true)"
          release_exists=false
          gh release view "$release_tag" >/dev/null 2>&1 && release_exists=true

          npm_exists=false
          npm_git_head=""
          if npm_metadata="$(npm view "${pkg_name}@${RELEASE_VERSION}" version gitHead --json 2>/dev/null)"; then
            npm_exists=true
            npm_git_head="$(jq -r '.gitHead // empty' <<<"$npm_metadata")"
          fi

          decision="$(
            EXPECTED_SHA="$GITHUB_SHA" \
            NPM_EXISTS="$npm_exists" \
            NPM_GIT_HEAD="$npm_git_head" \
            TAG_SHA="$existing_tag_sha" \
            RELEASE_EXISTS="$release_exists" \
            RELEASE_DRY_RUN="$dry_run" \
            node - <<'NODE'
          const { decideReleasePostpublish } = require("./.github/scripts/release-postpublish.cjs");
          const result = decideReleasePostpublish({
            expectedSha: process.env.EXPECTED_SHA,
            npmExists: process.env.NPM_EXISTS === "true",
            npmGitHead: process.env.NPM_GIT_HEAD,
            tagSha: process.env.TAG_SHA,
            releaseExists: process.env.RELEASE_EXISTS === "true",
            dryRun: process.env.RELEASE_DRY_RUN === "true",
          });
          process.stdout.write(JSON.stringify(result));
          NODE
          )"
          action="$(jq -r .action <<<"$decision")"
          echo "publish-needed=$(jq -r .publish <<<"$decision")" >> "$GITHUB_OUTPUT"
          echo "tag-needed=$(jq -r .createTag <<<"$decision")" >> "$GITHUB_OUTPUT"
          echo "release-needed=$(jq -r .createRelease <<<"$decision")" >> "$GITHUB_OUTPUT"
          echo "::notice::Release metadata disposition: ${action}"

      - name: Build and validate release changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ env.DISPATCH_VERSION }}
          NPM_DIST_TAG: ${{ env.DISPATCH_TAG }}
        run: |
          set -euo pipefail
          notes_file="$GITHUB_WORKSPACE/.release-notes.md"
          bun scripts/build-release-changelog.ts \
            --version "$RELEASE_VERSION" \
            --dist-tag "$NPM_DIST_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --out "$notes_file"
          test -s "$notes_file" || {
            echo "::error::release changelog builder produced an empty notes file"
            exit 1
          }

      - name: Publish (or dry-run)
        env:
          DRY_RUN: ${{ env.DISPATCH_DRY_RUN }}
          NPM_DIST_TAG: ${{ env.DISPATCH_TAG }}
          CANDIDATE_PACKAGE_PATH: ${{ steps.candidate-package.outputs.path }}
          PUBLISH_NEEDED: ${{ steps.release-metadata.outputs.publish-needed }}
        run: |
          set -euo pipefail
          package_file=""
          if [ -n "$DISPATCH_CANDIDATE_RUN_ID" ]; then
            package_file="./${CANDIDATE_PACKAGE_PATH#./}"
            test -f "$package_file" || { echo "::error::verified candidate package path is unavailable"; exit 1; }
          fi
          if [ -z "$DISPATCH_CANDIDATE_RUN_ID" ] && [ "$DRY_RUN" = "true" ]; then
            echo "::notice::TRANSITIONAL DRY RUN — building locally; automatic main releases always consume an immutable candidate"
            npm run prepublishOnly
            npm pack --dry-run
          elif [ "$PUBLISH_NEEDED" != "true" ]; then
            echo "::notice::Exact npm version is already published from ${GITHUB_SHA}; resuming post-publish metadata only"
          elif [ -z "$DISPATCH_CANDIDATE_RUN_ID" ]; then
            echo "::warning::transitional manual release is building locally; migrate this caller to candidate IDs"
            npm publish --tag "$NPM_DIST_TAG" --access public
          elif [ "$DRY_RUN" = "true" ]; then
            echo "::notice::DRY RUN — validating exact candidate tarball, not publishing"
            npm publish "$package_file" --tag "$NPM_DIST_TAG" --access public --ignore-scripts --dry-run
          else
            npm publish "$package_file" --tag "$NPM_DIST_TAG" --access public --ignore-scripts
          fi

      # Confirm the registry actually has the new version (real publishes only).
      - name: Post-publish registry smoke
        if: ${{ env.DISPATCH_DRY_RUN != 'true' }}
        env:
          RELEASE_VERSION: ${{ env.DISPATCH_VERSION }}
        run: |
          pkg_name="$(node -p "require('./package.json').name")"
          for attempt in $(seq 1 30); do
            if VERSION=$(npm view "${pkg_name}@${RELEASE_VERSION}" version 2>/dev/null); then
              echo "registry version=$VERSION"
              test "$VERSION" = "$RELEASE_VERSION"
              npm dist-tag ls "$pkg_name"
              exit 0
            fi
            echo "::notice::${pkg_name}@${RELEASE_VERSION} not visible in npm registry yet (attempt $attempt/30)"
            sleep 10
          done
          echo "::error::npm registry smoke failed after 30 attempts"
          npm view "$pkg_name" versions dist-tags --json || true
          exit 1

      - name: Create GitHub release
        if: ${{ env.DISPATCH_DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ env.DISPATCH_VERSION }}
          TAG_NEEDED: ${{ steps.release-metadata.outputs.tag-needed }}
          RELEASE_NEEDED: ${{ steps.release-metadata.outputs.release-needed }}
        run: |
          set -euo pipefail

          release_tag="v${RELEASE_VERSION}"
          notes_file="$GITHUB_WORKSPACE/.release-notes.md"
          test -s "$notes_file" || {
            echo "::error::validated release notes are missing; refusing to tag or create a release"
            exit 1
          }

          git fetch --force --tags origin

          existing_tag_sha="$(git rev-parse -q --verify "refs/tags/${release_tag}^{commit}" || true)"
          if [ -n "$existing_tag_sha" ] && [ "$existing_tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::${release_tag} already points at ${existing_tag_sha}, not ${GITHUB_SHA}"
            exit 1
          fi

          prerelease_flag=""
          if [[ "$RELEASE_VERSION" == *-preview.* || "$RELEASE_VERSION" == *-dev.* ]]; then
            prerelease_flag="--prerelease"
          fi

          if [ "$TAG_NEEDED" = "true" ]; then
            # Checkout deliberately leaves no credential in .git/config. Create
            # the lightweight tag through the authenticated API instead of an
            # unauthenticated git push, then verify the public ref before release.
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${release_tag}" -f sha="$GITHUB_SHA" >/dev/null; then
              echo "::notice::Tag creation raced another writer; verifying the resulting ref"
            fi
          fi

          git fetch --force --tags origin
          published_tag_sha="$(git rev-parse -q --verify "refs/tags/${release_tag}^{commit}" || true)"
          if [ "$published_tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::${release_tag} resolved to ${published_tag_sha:-nothing}, not ${GITHUB_SHA}"
            exit 1
          fi

          if [ "$RELEASE_NEEDED" = "true" ]; then
            if ! gh release create "$release_tag" --target "$GITHUB_SHA" --title "$release_tag" \
              --notes-file "$notes_file" ${prerelease_flag:+$prerelease_flag}; then
              echo "::notice::Release creation raced another writer; verifying the resulting release"
              gh release view "$release_tag" --json tagName,targetCommitish >/dev/null
            fi
          else
            echo "::notice::GitHub Release ${release_tag} already exists at the verified tag"
          fi
