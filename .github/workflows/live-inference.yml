name: Live provider inference

# Each OCX_LIVE_SMOKE_*_B64 environment secret is a base64-encoded JSON object
# containing only that provider's temporary config.json/auth.json payload. Base64
# is transport encoding, not encryption; GitHub Environment secrets provide the
# protection. Never commit a bundle or echo its decoded contents.

on:
  push:
    branches: [dev]
    paths:
      - "src/adapters/google.ts"
      - "src/adapters/google-wire-compiler.ts"
      - "src/adapters/google-tool-schema.ts"
      - "src/adapters/google-antigravity-wire.ts"
      - "src/server/responses-undeclared-tool-guard.ts"
      - "src/types/tools.ts"
      - "src/adapters/cursor.ts"
      - "src/adapters/cursor/**"
      - "src/adapters/command-code.ts"
      - "src/adapters/command-code-project-context.ts"
      - "src/providers/command-code-efforts.ts"
      - "src/adapters/openai-responses.ts"
      - "src/adapters/responses-tool-schema.ts"
      - "src/smoke/**"
      - "scripts/live-smoke.ts"
      - "scripts/live-smoke-ci.ts"
      - "scripts/live-inference-supervisor.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/live-inference.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: live-inference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Select changed providers
    if: github.event_name == 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_work: ${{ steps.matrix.outputs.has_work }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect changed providers
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared:
              - 'src/smoke/**'
              - 'scripts/live-smoke.ts'
              - 'scripts/live-smoke-ci.ts'
              - 'scripts/live-inference-supervisor.ts'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/live-inference.yml'
            google:
              - 'src/adapters/google.ts'
              - 'src/adapters/google-wire-compiler.ts'
              - 'src/adapters/google-tool-schema.ts'
              - 'src/adapters/google-antigravity-wire.ts'
              - 'src/server/responses-undeclared-tool-guard.ts'
              - 'src/types/tools.ts'
            cursor:
              - 'src/adapters/cursor.ts'
              - 'src/adapters/cursor/**'
            command_code:
              - 'src/adapters/command-code.ts'
              - 'src/adapters/command-code-project-context.ts'
              - 'src/providers/command-code-efforts.ts'
            openai:
              - 'src/adapters/openai-responses.ts'
              - 'src/adapters/responses-tool-schema.ts'

      - name: Build provider matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHARED: ${{ steps.filter.outputs.shared }}
          GOOGLE: ${{ steps.filter.outputs.google }}
          CURSOR: ${{ steps.filter.outputs.cursor }}
          COMMAND_CODE: ${{ steps.filter.outputs.command_code }}
          OPENAI: ${{ steps.filter.outputs.openai }}
        run: |
          matrix="$(bun -e '
            const all = [
              { provider: "google-antigravity", secret_name: "OCX_LIVE_SMOKE_GOOGLE_ANTIGRAVITY_B64" },
              { provider: "google-aistudio", secret_name: "OCX_LIVE_SMOKE_GOOGLE_AISTUDIO_B64" },
              { provider: "cursor", secret_name: "OCX_LIVE_SMOKE_CURSOR_B64" },
              { provider: "command-code", secret_name: "OCX_LIVE_SMOKE_COMMAND_CODE_B64" },
              { provider: "openai", secret_name: "OCX_LIVE_SMOKE_OPENAI_B64" },
            ];
            const selected = process.env.EVENT_NAME === "workflow_dispatch" || process.env.SHARED === "true"
              ? all
              : all.filter(item => (item.provider.startsWith("google-") ? process.env.GOOGLE : process.env[item.provider.replaceAll("-", "_").toUpperCase()]) === "true");
            process.stdout.write(JSON.stringify({ include: selected }));
          ')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = '{"include":[]}' ]; then
            echo 'has_work=false' >> "$GITHUB_OUTPUT"
          else
            echo 'has_work=true' >> "$GITHUB_OUTPUT"
          fi

  live:
    name: ${{ matrix.provider }} live inference
    needs: changes
    if: needs.changes.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    environment: live-inference
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare ephemeral provider credentials
        id: prepare
        env:
          BUNDLE_B64: ${{ secrets[matrix.secret_name] }}
        run: |
          if [ -z "${BUNDLE_B64:-}" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            {
              echo "### ${{ matrix.provider }} live inference"
              echo
              echo "Skipped: environment secret ${{ matrix.secret_name }} is not configured."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          smoke_home="$(mktemp -d "$RUNNER_TEMP/ocx-live-home.XXXXXX")"
          echo "home=$smoke_home" >> "$GITHUB_OUTPUT"
          OPENCODEX_HOME="$smoke_home" OCX_LIVE_SMOKE_BUNDLE_B64="$BUNDLE_B64" bun scripts/live-smoke-ci.ts
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Start isolated proxy
        if: steps.prepare.outputs.configured == 'true'
        env:
          OPENCODEX_HOME: ${{ steps.prepare.outputs.home }}
        run: |
          log_file="$RUNNER_TEMP/ocx-live-${{ matrix.provider }}.log"
          control_dir="$RUNNER_TEMP/ocx-live-control-${{ matrix.provider }}"
          runtime_file="$OPENCODEX_HOME/runtime-port.json"
          mkdir -m 700 -- "$control_dir"
          touch "$control_dir/launch-intent"
          bun scripts/live-inference-supervisor.ts "$control_dir" \
            bun run src/cli/index.ts start >"$log_file" 2>&1 &

          for _ in $(seq 1 60); do
            if [ -s "$control_dir/pid" ] && [ -s "$runtime_file" ]; then
              proxy_pid="$(cat "$control_dir/pid")"
              proxy_port="$(jq -er --argjson pid "$proxy_pid" \
                'select(.pid == $pid and (.port | type) == "number" and .port > 0 and .port != 10100) | .port' \
                "$runtime_file" 2>/dev/null || true)"
              if [ -n "$proxy_port" ]; then
                health="$(curl --fail --silent --show-error --max-time 2 \
                  "http://127.0.0.1:${proxy_port}/healthz" 2>/dev/null || true)"
                if jq -e --argjson pid "$proxy_pid" --argjson port "$proxy_port" \
                  '.service == "opencodex" and .pid == $pid and .port == $port' \
                  >/dev/null 2>&1 <<<"$health"; then
                  echo "$proxy_port" > "$control_dir/port"
                  exit 0
                fi
              fi
            fi
            if [ -s "$control_dir/stopped" ]; then
              break
            fi
            sleep 1
          done
          echo "proxy did not become healthy for ${{ matrix.provider }}"
          exit 1

      - name: Run real inference smoke
        id: smoke
        if: steps.prepare.outputs.configured == 'true'
        env:
          OPENCODEX_HOME: ${{ steps.prepare.outputs.home }}
        run: |
          control_dir="$RUNNER_TEMP/ocx-live-control-${{ matrix.provider }}"
          proxy_port="$(cat "$control_dir/port" 2>/dev/null || true)"
          if ! [[ "$proxy_port" =~ ^[1-9][0-9]*$ ]] || [ "$proxy_port" -eq 10100 ] || [ "$proxy_port" -gt 65535 ]; then
            echo "::error::Missing or invalid isolated proxy port."
            exit 1
          fi

          run_attempt() {
            attempt="$1"
            result_file="$RUNNER_TEMP/ocx-live-${{ matrix.provider }}-attempt-${attempt}.json"
            if bun scripts/live-smoke.ts --provider "${{ matrix.provider }}" \
              --url "http://127.0.0.1:${proxy_port}/v1/responses" --json >"$result_file"; then
              smoke_status=0
            else
              smoke_status=$?
            fi
            if bun scripts/live-smoke-report.ts --result "$result_file" --attempt "$attempt"; then
              report_status=0
            else
              report_status=$?
            fi
            rm -f -- "$result_file"
            if [ "$report_status" -ne 0 ]; then
              return "$report_status"
            fi
            return "$smoke_status"
          }

          if run_attempt 1; then
            exit 0
          fi
          echo "First live inference attempt failed; retrying once after a five-second backoff."
          sleep 5
          run_attempt 2

      - name: Stop proxy and remove credentials
        if: always() && steps.prepare.outputs.home != ''
        env:
          OPENCODEX_HOME: ${{ steps.prepare.outputs.home }}
        run: |
          control_dir="$RUNNER_TEMP/ocx-live-control-${{ matrix.provider }}"
          cleanup_failed=false

          if [ -e "$control_dir/launch-intent" ]; then
            touch "$control_dir/stop"
            for _ in $(seq 1 25); do
              [ -s "$control_dir/stopped" ] && break
              sleep 1
            done
            if [ ! -s "$control_dir/stopped" ]; then
              echo "::error::The owning proxy supervisor did not confirm process exit."
              cleanup_failed=true
            fi
          fi

          if [ "$cleanup_failed" = false ] && [ -n "${OPENCODEX_HOME:-}" ]; then
            if [ -e "$OPENCODEX_HOME" ]; then
              canonical_home="$(cd -P -- "$OPENCODEX_HOME" 2>/dev/null && pwd -P || true)"
              canonical_runner_temp="$(cd -P -- "$RUNNER_TEMP" 2>/dev/null && pwd -P || true)"
              case "$canonical_home" in
                "$canonical_runner_temp"/ocx-live-home.*) ;;
                *)
                  echo "::error::Refusing to remove a non-ephemeral OPENCODEX_HOME."
                  exit 1
                  ;;
              esac
            fi

            for attempt in 1 2 3; do
              rm -rf -- "$OPENCODEX_HOME" 2>/dev/null || true
              if [ ! -e "$OPENCODEX_HOME" ]; then
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep 1
              fi
            done
            if [ -e "$OPENCODEX_HOME" ]; then
              echo "::error::Ephemeral provider credentials were not removed."
              cleanup_failed=true
            fi
          elif [ "$cleanup_failed" = true ]; then
            echo "::error::Retaining the credential home because proxy exit is unconfirmed."
          fi

          if [ "$cleanup_failed" = true ]; then
            exit 1
          fi

      - name: Reconcile Jules live-inference supervision
        if: always() && steps.prepare.outputs.home != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          LIVE_JOB_STATUS: ${{ job.status }}
          LIVE_PROVIDER: ${{ matrix.provider }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const provider = process.env.LIVE_PROVIDER;
            if (!/^[a-z0-9][a-z0-9._-]{0,63}$/i.test(provider || "")) {
              throw new Error("invalid live inference provider identity");
            }
            const marker = `<!-- opencodex-live-inference-failure:${provider} -->`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const existing = issues.find(issue =>
              !issue.pull_request && String(issue.body || "").includes(marker));
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const status = process.env.LIVE_JOB_STATUS;
            if (status === "success") {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Recovered on exact head ${context.sha} in trusted workflow run ${runUrl}.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: "closed", state_reason: "completed"
                });
              }
              return;
            }
            if (status !== "failure") {
              core.warning(`Live inference ended as ${status}; no Jules issue was mutated.`);
              return;
            }
            const body = [
              marker,
              `Provider: ${provider}`,
              `Exact dev head: ${context.sha}`,
              `Trusted run: ${runUrl}`,
              "",
              "The isolated live-provider job failed after its bounded retry. Inspect only the privacy-safe gate summary in the failed job; raw provider responses and credential material are intentionally unavailable.",
              "",
              "Action: determine whether this is an external provider incident or a repository regression. For a regression, make the smallest tested fix on a PR targeting dev. Do not weaken credentials, workflow permissions, live assertions, privacy policy, or required checks. If the provider recovered without a code change, document that evidence and close this incident.",
            ].join("\n");
            const labelDefinitions = {
              "agent:generated": ["0969da", "Trusted generated maintenance issue"],
              "agent:jules": ["8250df", "Trusted Jules implementation request"],
              "agent:queued": ["d4c5f9", "Maintenance task queued"],
            };
            const currentLabels = new Set((await github.paginate(
              github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 }
            )).map(label => label.name));
            for (const [name, [color, description]] of Object.entries(labelDefinitions)) {
              if (currentLabels.has(name)) continue;
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }
            const labels = Object.keys(labelDefinitions);
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number,
                title: `[agent:live-inference] ${provider} smoke failure`, body,
                labels: [...new Set([...(existing.labels || []).map(label => label.name || label), ...labels])],
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Failure recurred on exact head ${context.sha}: ${runUrl}`,
              });
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title: `[agent:live-inference] ${provider} smoke failure`, body, labels
              });
              core.notice(`Queued Jules live-inference incident #${created.data.number}.`);
            }
