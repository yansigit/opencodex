name: Promote dev to main

# A successful dev integration push opens or updates a human-gated promotion
# PR. This workflow never merges main; release promotion remains explicit.
on:
  workflow_run:
    workflows: ["Cross-platform CI"]
    types: [completed]
    branches: [dev, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev') ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout trusted promotion controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the CI head is still dev
        id: verify
        env:
          EXPECTED_CI_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live_dev_sha="$(git ls-remote origin refs/heads/dev | awk 'NR == 1 { print $1 }')"
          expected_ci_sha="${EXPECTED_CI_SHA:-$live_dev_sha}"
          if ! printf '%s\n' "$live_dev_sha" "$expected_ci_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::dev or CI head did not return a full commit SHA"
            exit 1
          fi
          if [ "$live_dev_sha" != "$expected_ci_sha" ]; then
            echo "::error::dev moved after CI completed; waiting for the newer CI run"
            exit 1
          fi
          ci_runs="$(gh run list --workflow ci.yml --commit "$live_dev_sha" --event push --limit 20 --json conclusion,status,headSha,event)"
          if ! jq -e --arg sha "$live_dev_sha" \
            'any(.[]; .headSha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")' \
            <<<"$ci_runs" >/dev/null; then
            echo "::error::no successful Cross-platform CI push run exists for verified dev"
            exit 1
          fi
          git fetch --no-tags origin "refs/heads/dev"
          fetched_dev_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$fetched_dev_sha" != "$expected_ci_sha" ]; then
            echo "::error::fetched dev ref did not match the verified CI commit"
            exit 1
          fi
          trees_differ=true
          if git diff --quiet HEAD "$fetched_dev_sha" --; then
            trees_differ=false
          fi
          echo "Promoting verified dev commit $expected_ci_sha"
          echo "verified_sha=$expected_ci_sha" >> "$GITHUB_OUTPUT"
          echo "trees_differ=$trees_differ" >> "$GITHUB_OUTPUT"

      - name: Create or update the human promotion PR
        if: steps.verify.outputs.trees_differ == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_CI_SHA: ${{ steps.verify.outputs.verified_sha }}
        run: |
          set -euo pipefail
          live_dev_sha="$(git ls-remote origin refs/heads/dev | awk 'NR == 1 { print $1 }')"
          if [ "$live_dev_sha" != "$VERIFIED_CI_SHA" ]; then
            echo "::error::dev moved before the promotion PR mutation"
            exit 1
          fi
          body_file="$RUNNER_TEMP/dev-promotion-body.md"
          cat > "$body_file" <<EOF
          ## Summary

          Promote the verified dev integration branch to main.

          ## Verification

          This PR was opened automatically after successful Cross-platform CI on dev.
          A human maintainer must review and merge it. This automation never merges main.

          ## Checklist

          - [ ] Required CI is green for the exact dev commit.
          - [ ] Release notes and versioning are ready.
          - [ ] A maintainer reviewed the promotion.
          EOF

          open_prs="$(gh pr list --base main --head dev --state open --json number)"
          if [ "$(jq length <<<"$open_prs")" -gt 1 ]; then
            echo "::error::multiple open dev-to-main promotion PRs exist"
            exit 1
          fi
          existing_pr="$(jq -r '.[0].number // empty' <<<"$open_prs")"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" \
              --title "promote: dev to main" \
              --body-file "$body_file" \
              --add-label "maintainer-sponsored"
            echo "Updated promotion PR #$existing_pr"
          else
            gh pr create \
              --base main \
              --head dev \
              --title "promote: dev to main" \
              --body-file "$body_file" \
              --label "maintainer-sponsored"
          fi
          promotion_head="$(gh pr list --base main --head dev --state open --json headRefOid --jq '.[0].headRefOid // empty')"
          if [ "$promotion_head" != "$VERIFIED_CI_SHA" ]; then
            echo "::error::promotion PR head changed before verification"
            exit 1
          fi

  backmerge:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout trusted promotion controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify main and dev are eligible
        id: verify-main
        env:
          EXPECTED_CI_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live_main_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if ! printf '%s\n' "$live_main_sha" "$EXPECTED_CI_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::main or CI head did not return a full commit SHA"
            exit 1
          fi
          if [ "$live_main_sha" != "$EXPECTED_CI_SHA" ]; then
            echo "::error::main moved after CI completed; waiting for the newer CI run"
            exit 1
          fi
          ci_runs="$(gh run list --workflow ci.yml --commit "$live_main_sha" --event push --limit 20 --json conclusion,status,headSha,event)"
          if ! jq -e --arg sha "$live_main_sha" \
            'any(.[]; .headSha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")' \
            <<<"$ci_runs" >/dev/null; then
            echo "::error::no successful Cross-platform CI push run exists for verified main"
            exit 1
          fi
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/dev:refs/remotes/origin/dev
          verified_main_sha="$(git rev-parse refs/remotes/origin/main)"
          live_dev_sha="$(git rev-parse refs/remotes/origin/dev)"
          if [ "$verified_main_sha" != "$EXPECTED_CI_SHA" ]; then
            echo "::error::fetched main ref did not match the verified CI commit"
            exit 1
          fi
          eligible=true
          if ! git merge-base --is-ancestor "$live_dev_sha" "$verified_main_sha"; then
            echo "dev is not an ancestor of verified main; leaving dev unchanged"
            eligible=false
          elif ! git diff --quiet "$verified_main_sha" "$live_dev_sha" --; then
            echo "main and dev trees differ; leaving dev unchanged"
            eligible=false
          fi
          {
            echo "eligible=$eligible"
            if [ "$eligible" = true ]; then
              echo "verified_main_sha=$verified_main_sha"
              echo "live_dev_sha=$live_dev_sha"
            fi
          } >> "$GITHUB_OUTPUT"
          if [ "$eligible" != true ]; then
            exit 0
          fi

      - name: Fast-forward dev to verified main
        if: steps.verify-main.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: 0
          VERIFIED_MAIN_SHA: ${{ steps.verify-main.outputs.verified_main_sha }}
          VERIFIED_DEV_SHA: ${{ steps.verify-main.outputs.live_dev_sha }}
        run: |
          set -euo pipefail
          live_main_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [ "$live_main_sha" != "$VERIFIED_MAIN_SHA" ]; then
            echo "::error::main moved before the dev back-merge"
            exit 1
          fi
          live_dev_sha="$(git ls-remote origin refs/heads/dev | awk 'NR == 1 { print $1 }')"
          if [ "$live_dev_sha" != "$VERIFIED_DEV_SHA" ]; then
            echo "::error::dev moved before the dev back-merge"
            exit 1
          fi
          askpass="$RUNNER_TEMP/git-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" git push origin "$VERIFIED_MAIN_SHA:refs/heads/dev"
          post_refs="$(git ls-remote origin refs/heads/main refs/heads/dev)"
          post_main_sha="$(awk '$2 == "refs/heads/main" { print $1 }' <<<"$post_refs")"
          post_dev_sha="$(awk '$2 == "refs/heads/dev" { print $1 }' <<<"$post_refs")"
          if [ "$post_main_sha" != "$VERIFIED_MAIN_SHA" ] || [ "$post_dev_sha" != "$VERIFIED_MAIN_SHA" ]; then
            echo "::error::dev back-merge postcheck failed; main or dev moved during the update"
            exit 1
          fi
