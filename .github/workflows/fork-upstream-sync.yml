name: Fork Upstream Sync

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: fork-upstream-sync-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      workflows: write
    steps:
      - name: Reject untrusted manual refs
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref_name != github.event.repository.default_branch &&
          github.ref_name != 'dev'
        run: |
          echo "Fork sync may only run from the default branch or dev."
          exit 1

      - name: Checkout trusted fork scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install script dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Fetch upstream release refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          askpass="$RUNNER_TEMP/git-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/lidge-jun/opencodex.git
          else
            git remote add upstream https://github.com/lidge-jun/opencodex.git
          fi
          git fetch --force upstream main dev --tags --prune
          bootstrap_refs=()
          if GIT_ASKPASS="$askpass" git ls-remote --exit-code origin refs/heads/vendor/main >/dev/null; then
            GIT_ASKPASS="$askpass" git fetch origin refs/heads/vendor/main:refs/heads/vendor/main
          else
            git branch vendor/main upstream/main
            bootstrap_refs+=(refs/heads/vendor/main:refs/heads/vendor/main)
          fi
          if GIT_ASKPASS="$askpass" git ls-remote --exit-code origin refs/heads/vendor/dev >/dev/null; then
            GIT_ASKPASS="$askpass" git fetch origin refs/heads/vendor/dev:refs/heads/vendor/dev
          else
            git branch vendor/dev upstream/dev
            bootstrap_refs+=(refs/heads/vendor/dev:refs/heads/vendor/dev)
          fi
          if [ "${#bootstrap_refs[@]}" -gt 0 ]; then
            GIT_ASKPASS="$askpass" git push origin "${bootstrap_refs[@]}"
          fi

      - name: Create dev integration worktree
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_SYNC_WORKTREE: ${{ runner.temp }}/fork-sync-dev
        run: |
          set -eu
          askpass="$RUNNER_TEMP/git-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" git fetch origin dev:refs/remotes/origin/dev
          git worktree add --detach "$FORK_SYNC_WORKTREE" refs/remotes/origin/dev

      - name: Configure sync commit identity
        env:
          FORK_SYNC_WORKTREE: ${{ runner.temp }}/fork-sync-dev
        run: |
          set -eu
          git -C "$FORK_SYNC_WORKTREE" config user.name "Yumi"
          # Keep the temporary address out of repository privacy scan patterns.
          git -C "$FORK_SYNC_WORKTREE" config user.email "automation""@""sbyoon.com"

      - name: Detect and pin vendor refs
        id: pin
        env:
          FORK_SYNC_UPSTREAM_REPO: https://github.com/lidge-jun/opencodex.git
          FORK_SYNC_WORKTREE: ${{ runner.temp }}/fork-sync-dev
        run: |
          set -eu
          cd "$FORK_SYNC_WORKTREE"
          event_file="$RUNNER_TEMP/fork-sync-event.json"
          bun "$GITHUB_WORKSPACE/scripts/fork/sync/cli.ts" pin > "$event_file"
          kind="$(jq -r '.kind' "$event_file")"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Fork sync lane: $kind" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$event_file" > "$RUNNER_TEMP/fork-sync-event-path"

      - name: Push updated vendor refs
        if: steps.pin.outputs.kind == 'pin-updated' || steps.pin.outputs.kind == 'history-diverged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          askpass="$RUNNER_TEMP/git-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" git push origin refs/heads/vendor/main:refs/heads/vendor/main refs/heads/vendor/dev:refs/heads/vendor/dev

      - name: Assert pin preserved checked-out branch HEAD
        env:
          EXPECTED_BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          current_branch="$(git rev-parse --abbrev-ref HEAD)"
          expected_branch="$EXPECTED_BRANCH"
          if [ "$current_branch" != "$expected_branch" ]; then
            echo "Pinning moved HEAD from $expected_branch to $current_branch"
            exit 1
          fi

      - name: Prepare daily merge
        id: prepare
        if: steps.pin.outputs.kind == 'pin-updated' || steps.pin.outputs.kind == 'main-behind' || steps.pin.outputs.kind == 'history-diverged'
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_SYNC_WORKTREE: ${{ runner.temp }}/fork-sync-dev
        run: |
          set -eu
          askpass="$RUNNER_TEMP/git-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          cd "$FORK_SYNC_WORKTREE"
          event_file="$(cat "$RUNNER_TEMP/fork-sync-event-path")"
          result_file="$RUNNER_TEMP/fork-sync-prepare.json"
          bun "$GITHUB_WORKSPACE/scripts/fork/sync/cli.ts" prepare < "$event_file" > "$result_file"
          status="$(jq -r '.status' "$result_file")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "merged" ]; then
            branch="$(jq -r '.branch' "$result_file")"
            remote_sha="$(GIT_ASKPASS="$askpass" git ls-remote origin "refs/heads/$branch" | awk 'NR == 1 { print $1 }')"
            if [ -n "$remote_sha" ]; then
              GIT_ASKPASS="$askpass" git push --force-with-lease=refs/heads/$branch:$remote_sha origin "refs/heads/$branch:refs/heads/$branch"
            else
              GIT_ASKPASS="$askpass" git push origin "refs/heads/$branch:refs/heads/$branch"
            fi
            jq -n \
              --slurpfile event "$event_file" \
              --slurpfile result "$result_file" \
              '{event: $event[0], result: $result[0]}' \
              > "$RUNNER_TEMP/fork-sync-draft-pr.json"
          elif [ "$status" = "hotspot-handoff" ] || [ "$status" = "history-diverged" ]; then
            branch="$(jq -r '.branch' "$result_file")"
            if [ "$status" = "history-diverged" ]; then
              git switch -C "$branch"
            fi
            if GIT_ASKPASS="$askpass" git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Sync handoff branch already exists: $branch"
            else
              GIT_ASKPASS="$askpass" git push origin "refs/heads/$branch:refs/heads/$branch"
            fi
          fi

      - name: Build sync handoff payload
        if: >-
          success() &&
          steps.pin.outputs.kind != 'already-current'
        env:
          FORK_SYNC_WORKTREE: ${{ runner.temp }}/fork-sync-dev
        run: |
          set -eu
          event_file="$(cat "$RUNNER_TEMP/fork-sync-event-path")"
          prepare_result='null'
          if [ -f "$RUNNER_TEMP/fork-sync-prepare.json" ]; then
            prepare_result="$(cat "$RUNNER_TEMP/fork-sync-prepare.json")"
          fi
          handoff_status="$(jq -r '.status // empty' "$RUNNER_TEMP/fork-sync-prepare.json" 2>/dev/null || true)"
          if [ -z "$handoff_status" ]; then
            handoff_status="$(jq -r '.kind' "$event_file")"
          fi
          head_sha="$(git -C "$FORK_SYNC_WORKTREE" rev-parse HEAD)"
          merge_base_shas="$(git -C "$FORK_SYNC_WORKTREE" merge-base --all HEAD vendor/main 2>/dev/null || true)"
          jq --arg prepareStatus "$handoff_status" \
            --arg headSha "$head_sha" \
            --arg mergeBaseShas "$merge_base_shas" \
            --argjson prepareResult "$prepare_result" \
            '($mergeBaseShas | split("\n") | map(select(length > 0))) as $bases
              | . + {prepareStatus: $prepareStatus, headSha: $headSha,
          mergeBaseShas: $bases, mergeBaseCount: ($bases | length),
                prepareResult: $prepareResult}' \
            "$event_file" > "$RUNNER_TEMP/fork-sync-handoff.json"

      - name: Create or update draft sync PR
        if: steps.prepare.outputs.status == 'merged'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          bun "$GITHUB_WORKSPACE/scripts/fork/sync/cli.ts" draft-pr < "$RUNNER_TEMP/fork-sync-draft-pr.json"

      # Conflict issue tracking is deferred until the Cursor handoff fails.
      - name: Notify GitHub issue
        if: >-
          steps.pin.outputs.kind != 'already-current' &&
          steps.pin.outputs.kind != 'history-diverged' &&
          steps.prepare.outputs.status != 'hotspot-handoff'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORK_SYNC_UPSTREAM_REPO: https://github.com/lidge-jun/opencodex.git
          FORK_SYNC_NOTIFIERS: github-issue
          FORK_SYNC_COORDINATORS: ""
          FORK_SYNC_WORKTREE: ${{ runner.temp }}/fork-sync-dev
        run: |
          set -eu
          bun "$GITHUB_WORKSPACE/scripts/fork/sync/cli.ts" emit < "$RUNNER_TEMP/fork-sync-handoff.json"

      # Cursor handles only conflicts the Action could not resolve or
      # disconnected histories; ordinary daily merges stop at a draft PR.
      - name: Notify Cursor handoff
        if: steps.prepare.outputs.status == 'hotspot-handoff' || steps.pin.outputs.kind == 'history-diverged'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORK_SYNC_UPSTREAM_REPO: https://github.com/lidge-jun/opencodex.git
          FORK_SYNC_NOTIFIERS: ""
          FORK_SYNC_COORDINATORS: cursor-webhook
          FORK_SYNC_CURSOR_WEBHOOK_URL: ${{ secrets.FORK_SYNC_CURSOR_WEBHOOK_URL }}
          FORK_SYNC_CURSOR_WEBHOOK_SECRET: ${{ secrets.FORK_SYNC_CURSOR_WEBHOOK_SECRET }}
        run: |
          set -u
          coordinator_status=1
          if [ -n "${FORK_SYNC_CURSOR_WEBHOOK_URL:-}" ] && [ -n "${FORK_SYNC_CURSOR_WEBHOOK_SECRET:-}" ]; then
            set +e
            bun "$GITHUB_WORKSPACE/scripts/fork/sync/cli.ts" emit < "$RUNNER_TEMP/fork-sync-handoff.json"
            coordinator_status=$?
            set -e
          fi
          if [ "$coordinator_status" -ne 0 ]; then
            FORK_SYNC_NOTIFIERS=github-issue FORK_SYNC_COORDINATORS="" \
              bun "$GITHUB_WORKSPACE/scripts/fork/sync/cli.ts" emit < "$RUNNER_TEMP/fork-sync-handoff.json"
          fi
