<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>OpenCodex AI Studio Exporter</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #18191c;
        color: #e2e4e9;
        margin: 0;
        padding: 1rem;
        width: 320px;
        line-height: 1.4;
      }
      h3 {
        margin: 0 0 0.5rem 0;
        font-size: 1rem;
      }
      p {
        margin: 0 0 0.5rem 0;
        font-size: 0.85rem;
        color: #9ca3af;
      }
      .field-label {
        display: block;
        font-size: 0.78rem;
        color: #9ca3af;
        margin-top: 0.5rem;
      }
      .input-text {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 0.25rem;
        padding: 0.4rem;
        border-radius: 4px;
        border: 1px solid #374151;
        background: #111827;
        color: #e2e4e9;
        font-size: 0.85rem;
      }
      .btn {
        display: block;
        width: 100%;
        padding: 0.5rem;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 0.6rem;
        text-align: center;
        box-sizing: border-box;
      }
      .btn:hover {
        background: #1d4ed8;
      }
      .btn-secondary {
        background: #374151;
      }
      .btn-secondary:hover {
        background: #4b5563;
      }
      #exportStatus {
        font-size: 0.8rem;
        margin-top: 0.5rem;
        min-height: 1.2rem;
      }
      a {
        color: #60a5fa;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h3>OpenCodex AI Studio</h3>
    <p style="font-size: 0.78rem;">Export your active Google AI Studio session & project credentials into OpenCodex for direct inference.</p>

    <label class="field-label" for="proxyPort">Proxy Port</label>
    <input id="proxyPort" class="input-text" type="number" min="1" max="65535" placeholder="10100">

    <label class="field-label" for="proxyApiKey">Proxy API key (required for Auto-Sync)</label>
    <input id="proxyApiKey" class="input-text" type="password" autocomplete="off" placeholder="Required">
    <p style="font-size: 0.7rem;">Allow this exact origin in <code>corsAllowOrigins</code>: <code id="extensionId"></code></p>

    <button id="btnAutoSync" class="btn">w^~)u Auto-Sync to OpenCodex</button>
    <button id="btnCopyBundle" class="btn btn-secondary">yyۧuK Copy Session Token</button>
    <div id="exportStatus"></div>

    <p style="margin-top: 0.8rem;"><a href="https://aistudio.google.com/prompts/new_chat" target="_blank">Open AI Studio Tab w^~)w</a></p>
    <script src="popup.js"></script>
  </body>
</html>
